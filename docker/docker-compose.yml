# Auxilium Manus — application stack
#
# Start Hatchet first (see docker/README.md):
#   docker network create internal 2>/dev/null || true
#   docker network create backend 2>/dev/null || true
#   cd docker/hatchet && docker compose up -d
#
# Then start the application stack from this directory:
#   docker compose -f docker-compose.yml -f docker-compose.hatchet-network.yml up -d
#
# Backend settings for manus-web / manus-worker are declared in x-manus-app-env
# below (mirrors backend/.env.example). Edit values here — not via docker/.env.
#
# manus-web: bind address, backend port, BACKEND_URL, and NODE_ENV are set by
# supervisord-web.conf. manus-worker only runs the Hatchet worker process.
# Optional URL overrides (DATABASE_URL, MAINTENANCE_DATABASE_URL, MANUS_REDIS_URL,
# PLUGINS_FILE) are omitted — values are built from the fields below.
# INITIAL_PERMISSIONS is omitted (unused by the backend).

x-manus-app-env: &manus-app-env
  # Application
  ENV: development
  SECRET_KEY: change-in-production-use-at-least-32-characters
  ACCESS_TOKEN_EXPIRE_MINUTES: 60
  DOCS_ENABLED: "true"
  TRUSTED_PROXY_IPS: ""
  INITIAL_USERNAME: admin
  INITIAL_PASSWORD: admin

  # Credential vault
  CREDENTIAL_ENCRYPTION_KEY: ""
  DATA_DIRECTORY: /app/data
  KDF_ITERATIONS: 100000

  # PostgreSQL (host/port point at the compose postgres service)
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: manus
  DATABASE_MAINTENANCE_NAME: postgres
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres

  # Redis (host/port point at the compose redis service)
  MANUS_REDIS_HOST: redis
  MANUS_REDIS_PORT: 6379
  MANUS_REDIS_PASSWORD: changeme
  MANUS_REDIS_KEY_PREFIX: manus-cache

  # Hatchet workflow engine
  # Create a token at http://localhost:8888 → Settings → API Tokens
  # Use hatchet-engine:7070 when attached via docker-compose.hatchet-network.yml
  HATCHET_CLIENT_TOKEN: ""
  HATCHET_CLIENT_HOST_PORT: host.docker.internal:7077
  HATCHET_CLIENT_TLS_STRATEGY: none
  HATCHET_CLIENT_DEBUG: "false"

  # Logging
  LOG_LEVEL: INFO
  LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  LOG_DIRECTORY: /app/data/logs
  LOG_MAX_BYTES: 10485760
  LOG_BACKUP_COUNT: 5

  # Workflow run retention (scripts/purge_retention.py)
  RUN_RETENTION_ENABLED: "false"
  RUN_RETENTION_DAYS: 90
  RUN_RETENTION_BATCH_SIZE: 500

  # Database schema sync (see doc/MIGRATION_SYSTEM.md)
  APPLY_SAFE_DATABASE_MIGRATION: "false"
  APPLY_RISKY_DATABASE_MIGRATION: "false"

services:
  postgres:
    image: postgres:17
    container_name: manus-postgres
    environment:
      POSTGRES_DB: manus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - manus-network

  redis:
    image: redis:8-alpine
    container_name: manus-redis
    command: redis-server --appendonly yes --requirepass changeme
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manus-network

  manus-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.all-in-one
    container_name: manus-web
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      <<: *manus-app-env
      # Frontend / process manager (not in backend/.env.example)
      FRONTEND_PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      SUPERVISORD_CONF: /etc/supervisor/conf.d/supervisord-web.conf
    volumes:
      - manus_data:/app/data
      - ./config:/app/config
      - ./logs:/app/data/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3000 && curl -f http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - manus-network
    command: ["/app/start.sh"]

  manus-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.all-in-one
    container_name: manus-worker
    environment:
      <<: *manus-app-env
      # Worker runs python -m hatchet.worker only (no API bootstrap / frontend).
      SUPERVISORD_CONF: /etc/supervisor/conf.d/supervisord-worker.conf
    volumes:
      - manus_data:/app/data
      - ./logs:/app/data/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for web so init_db / admin seed finish before the worker accepts jobs.
      manus-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - manus-network
    command: ["/app/start.sh"]

volumes:
  manus_data:
  postgres_data:
  redis_data:

networks:
  manus-network:
    driver: bridge
