[supervisord]
nodaemon=true
# Runs as root on purpose (see docker/start.sh); each [program:*] drops
# to the unprivileged 'manus' account via user=manus.
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid

[program:backend]
command=/usr/local/bin/python start.py
directory=/app/backend
user=manus
autorestart=true
environment=LOG_LEVEL=%(ENV_LOG_LEVEL)s,BACKEND_HOST="0.0.0.0",BACKEND_PORT="8000",HOME="/app/data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=npm start
directory=/app/frontend
user=manus
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/frontend.err.log
stdout_logfile=/var/log/supervisor/frontend.out.log
environment=
    NODE_ENV="production",
    PORT=%(ENV_FRONTEND_PORT)s,
    BACKEND_URL="http://127.0.0.1:8000",
    HOME="/app/data"
