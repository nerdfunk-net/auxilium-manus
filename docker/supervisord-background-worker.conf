[supervisord]
nodaemon=true
# Runs as root on purpose (see docker/start.sh); each [program:*] drops
# to the unprivileged 'manus' account via user=manus.
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid

[program:hatchet-dynamic-worker]
command=/usr/local/bin/python -m hatchet.dynamic_worker
directory=/app/backend
user=manus
autorestart=true
environment=LOG_LEVEL=%(ENV_LOG_LEVEL)s,HOME="/app/data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=600
stopsignal=TERM
