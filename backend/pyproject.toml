[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: heavy tests against real devices or live services (opt-in)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "migrations/*", "scripts/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
