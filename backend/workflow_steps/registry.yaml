# Plugin registry for Auxilium Manus.
#
# Capability fields (requires, produces, consumes, outcomes) drive canvas validation
# and runtime guards. metadata.configuration_input drives step config forms.
schema_version: 1

plugins:
  - id: get-nautobot-devices
    name: Get from Nautobot
    overview: Select devices from the Nautobot inventory.
    description: Select one or more target devices from the inventory.
    artifact_type: inventory_selector
    palette_category: nautobot
    directory: get_nautobot_devices
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: nautobot_source_id
          description: ID of a Nautobot source configured under Settings → Sources.
          data_type: string
          required: true
          example: prod-lab
        - name: inventory_source
          description: >
            "fixed" (default) resolves the canvas device_filter / device_ids snapshot.
            "run_param" resolves the inventory id held in the run parameter named by
            inventory_param — a workflow static_attribute of type "reference",
            ref_kind "inventory" — scoped to the user that triggered the run. Lets one
            workflow target a different saved inventory per manual run or per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: inventory_param
          description: >
            Name of the run parameter (workflow static_attribute) that carries the
            inventory id, used only when inventory_source is "run_param".
          data_type: string
          required: false
          example: target_inventory
        - name: inventory_id
          description: ID of the saved inventory selected in the workflow builder.
          data_type: integer
          required: false
          example: 42
        - name: inventory_name
          description: Display name of the selected saved inventory.
          data_type: string
          required: false
          example: Core routers
        - name: inventory_type
          description: >
            Type of the selected saved inventory at configuration time — "filter"
            (logical expression, resolved via device_filter) or "static" (an explicit,
            hand-picked device list built with Selection Mode, resolved via device_ids).
            Missing/omitted is treated as "filter" for backward compatibility.
          data_type: string
          required: false
          default: filter
          example: filter
        - name: device_filter
          description: >
            Filter tree snapshot derived from the selected inventory at configuration time.
            Used at runtime to resolve devices from Nautobot when inventory_type is "filter".
          data_type: object
          required: false
        - name: device_ids
          description: >
            Explicit Nautobot device UUID list snapshot derived from the selected inventory
            at configuration time. Used at runtime to resolve devices directly (no logical
            expression) when inventory_type is "static".
          data_type: array
          required: false
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-ise-devices
    name: Get from ISE
    overview: Select devices from Cisco ISE.
    description: >
      Look up network devices in Cisco ISE by name, IP/CIDR, or network device group.
    artifact_type: inventory_selector
    palette_category: cisco
    directory: get_ise_devices
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: ise_source_id
          description: ID of a Cisco ISE source configured under Settings → Sources.
          data_type: string
          required: true
          example: lab-ise
        - name: query_mode
          description: >
            How to look up devices in ISE — "name", "cidr", or "group".
          data_type: string
          required: true
          example: name
        - name: device_names
          description: Device names to look up. Used when query_mode is "name".
          data_type: array
          required: false
        - name: cidr
          description: >
            IP address or CIDR prefix to match against ISE device IPs.
            Used when query_mode is "cidr".
          data_type: string
          required: false
          example: 10.10.10.0/24
        - name: group_name
          description: >
            Full hierarchical ISE network device group (NDG) name.
            Used when query_mode is "group".
          data_type: string
          required: false
          example: "Location#All Locations#Building1"
        - name: resolve_to_devices
          description: >
            When enabled, entries with a netmask other than /32 (possible
            groups or subnets) are expanded into individual devices by
            querying Nautobot's Primary Prefix filter (within_include) for
            the CIDR derived from the entry's IP/mask. Requires
            nautobot_source_id. If no matching Nautobot devices are found,
            the raw ISE entry is kept unchanged.
          data_type: boolean
          required: false
          example: false
        - name: nautobot_source_id
          description: >
            ID of a Nautobot source configured under Settings → Sources.
            Required when resolve_to_devices is enabled.
          data_type: string
          required: false
          example: prod-lab
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-ise-tacacs-key
    name: Get TACACS+ Key from ISE
    overview: Look up a device's TACACS+ shared secret in Cisco ISE.
    description: >
      Resolve each device's TACACS+ key from Cisco ISE using a configurable priority
      of name, location-group, and IP-based lookups.
    artifact_type: configuration_management
    palette_category: cisco
    directory: get_ise_tacacs_key
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: ise_source_id
          description: >
            ID of a Cisco ISE source configured under Settings → Sources. If ISE
            cannot be reached or authentication fails, the step routes to the
            failure outcome instead of raising (a per-device "key not found" still
            routes to success — see the failure outcome description).
          data_type: string
          required: true
          example: lab-ise
        - name: priority
          description: >
            Ordered list of lookup strategies, each individually enabled/disabled,
            tried in order until one finds a key: name_exact_32 (device name, ISE
            entry netmask must be /32), name_any (device name, any netmask),
            location_group (Nautobot device location as an ISE Location network
            device group), ip_prefix_scan (device's primary IPv4, narrowing from
            /32 down to /8 via ISE's exact-match filter — cheap, but only finds
            entries stored as a clean CIDR network address), ip_range_scan
            (full-inventory fallback for ISE entries stored as a range, e.g.
            "192.168.178.1-254", or a wildcard, e.g. "192.168.178.*" — these
            can't be found via ISE's server-side filter at all).
          data_type: object
          required: true
          example:
            - type: name_exact_32
              enabled: true
            - type: name_any
              enabled: true
            - type: location_group
              enabled: true
            - type: ip_prefix_scan
              enabled: true
            - type: ip_range_scan
              enabled: true
        - name: location_group_prefix
          description: >
            Prefix used to build the ISE Location group name for the
            location_group tier, as Location#{prefix}#{nautobot location name}.
          data_type: string
          required: false
          example: All Locations

  - id: update-ise-tacacs-key
    name: Update TACACS+ Key in ISE
    overview: Set a device's TACACS+ shared secret in Cisco ISE.
    description: >
      Update each device's TACACS+ shared secret in Cisco ISE. The new key can be a
      fixed value or resolved per device from a {path.to.value} attribute expression.
    artifact_type: command_execution
    palette_category: cisco
    directory: update_ise_tacacs_key
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: ise_source_id
          description: >
            ID of a Cisco ISE source configured under Settings → Sources. If ISE
            cannot be reached or authentication fails, the step routes to the
            failure outcome instead of raising (a per-device lookup/update miss
            still routes to success — see the failure outcome description).
          data_type: string
          required: true
          example: lab-ise
        - name: new_key
          description: >
            The TACACS+ shared secret to set on every device. Use a fixed value, or
            wrap a dot path in braces to resolve it per device from the device's
            attribute bags, e.g. {custom.new_tacacs_key} or
            {nautobot.custom_fields.tacacs_key}, optionally with a fallback:
            {custom.new_tacacs_key | default('fallback-value')}. A device whose
            expression resolves to nothing, or whose device can't be located or
            updated in ISE, is marked failed but does not stop the step.
          data_type: string
          required: true
          example: "{custom.new_tacacs_key}"

  - id: add-to-ise
    name: Add to ISE
    overview: Create a new network device in Cisco ISE.
    description: >
      Register each device as a new network device in Cisco ISE, with an IP address,
      optional device group memberships, and a TACACS+ shared secret.
    artifact_type: command_execution
    palette_category: cisco
    directory: add_to_ise
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: ise_source_id
          description: >
            ID of a Cisco ISE source configured under Settings → Sources. If ISE
            cannot be reached or authentication fails, the step routes to the
            failure outcome instead of raising (a per-device create failure still
            routes to success — see the failure outcome description).
          data_type: string
          required: true
          example: lab-ise
        - name: device_name
          description: >
            The device name to register in ISE. Use a fixed value, or wrap a dot path
            in braces to resolve it per device from the device's attribute bags, e.g.
            {name} or {nautobot.custom_fields.device_name}, optionally with a
            fallback: {name | default('fallback-name')}. A device whose expression
            resolves to nothing is marked failed but does not stop the step.
          data_type: string
          required: true
          example: "{name}"
        - name: description
          description: Fixed description text set on the created ISE device. Optional.
          data_type: string
          required: false
        - name: ip_address
          description: >
            The device's IP address to register in ISE. Use a fixed value, or a
            {path.to.value} expression with the same convention as device_name, e.g.
            {primary_ip4}. Nautobot's primary_ip4 is commonly stored with a netmask
            suffix (e.g. 10.0.0.1/24) — any /nn suffix is stripped automatically and
            the device is registered as a single host (mask 32); there is no separate
            netmask field. If {primary_ip4} doesn't resolve (the device's own
            primary_ip4 field is only set by inventory steps that fetch full device
            records, e.g. Get from Nautobot), it automatically falls back to the
            nautobot.primary_ip4.address attribute bag path, which is where the IP
            lives for devices sourced via Get from List/Get from ISE and enriched by
            Get Nautobot Attributes.
          data_type: string
          required: true
          example: "{primary_ip4}"
        - name: new_key
          description: >
            The TACACS+ shared secret to set on the created device. Use a fixed value,
            or a {path.to.value} expression with the same convention as device_name.
          data_type: string
          required: true
          example: "{custom.new_tacacs_key}"
        - name: device_groups
          description: >
            Full hierarchical ISE network device group (NDG) names the new device
            should belong to, e.g. "Location#All Locations" or
            "Device Type#All Device Types". Leave empty for no group memberships.
          data_type: array
          required: false
          example:
            - "Location#All Locations"
            - "Device Type#All Device Types"

  - id: parse-cisco-config
    name: Parse Cisco Config
    overview: Parse a Cisco running/startup config into structured data.
    description: >
      Parse a Cisco IOS/IOS-XE/NXOS/XR running and/or startup configuration into
      structured data (hostname, VRFs, VLANs, interfaces, ACLs, routing, etc.)
      using cisco-config-parser, for use by Jinja templates and Log Attributes.
    artifact_type: configuration_management
    palette_category: cisco
    directory: parse_cisco_config
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: cisco_config
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: config_source
          description: Which config to parse — running, startup, or both.
          data_type: string
          required: true
          example: both
        - name: output_key
          description: >
            Unique key for this step's parsed output on each device (used by
            downstream Jinja templates and Log Attributes as
            parsed.<output_key>). The value is ALWAYS
            {running: <model|null>, startup: <model|null>} regardless of
            config_source — the branch not parsed is null — so downstream paths
            look like parsed.<output_key>.running.<field>.
          data_type: string
          required: true
          example: cisco_config

  - id: add-pyats-testbed
    name: Add Testbed
    overview: Build a pyATS testbed from the current device list.
    description: >
      Resolve a credential and pyATS shim source for the current device list,
      producing a reusable testbed bundle that downstream pyATS-backed steps
      (e.g. Get & Parse Config) consume without needing their own
      credential/source configuration.
    artifact_type: configuration_management
    palette_category: pyats
    directory: add_pyats_testbed
    enabled: true
    requires: [identity]
    produces: [pyats_testbed]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: pyats_source_id
          description: ID of a pyATS source configured under Settings → Sources.
          data_type: string
          required: true
          example: lab-pyats
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: network_driver_override
          description: Override the resolved pyATS os for all devices in this step.
          data_type: string
          required: false
          example: iosxe

  - id: get-pyats-config
    name: Get & Parse Config
    overview: Get running config via pyATS and parse it with Genie.
    description: >
      Fetch running configuration via the pyATS shim and parse it with Genie
      into structured data. Requires an upstream Add Testbed step.
    artifact_type: configuration_management
    palette_category: pyats
    directory: get_pyats_config
    enabled: true
    requires: [identity, pyats_testbed]
    produces: [parsed]
    primary_output: pyats_config
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: output_key
          description: >
            Unique key for this step's parsed output on each device (used by
            downstream Jinja templates and Log Attributes as
            parsed.<output_key>). Nested under "running".
          data_type: string
          required: true
          example: pyats_config

  - id: get-pyats-snapshot
    name: Get Snapshot
    overview: Capture a Genie "learn" snapshot of live device state.
    description: >
      Learn one or more Genie features (BGP, OSPF, interfaces, platform, ...)
      or "all" via pyATS and store the structured snapshot. Requires an
      upstream Add Testbed step.
    artifact_type: configuration_management
    palette_category: pyats
    directory: get_pyats_snapshot
    enabled: true
    requires: [identity, pyats_testbed]
    produces: [parsed]
    primary_output: pyats_snapshot
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: features
          description: >
            Genie learn feature names to capture (e.g. bgp, ospf, interface),
            or ["all"] for everything supported on the device.
          data_type: array
          required: true
        - name: output_key
          description: >
            Unique key for this step's snapshot on each device
            (parsed.<output_key>).
          data_type: string
          required: true
          example: pyats_snapshot

  - id: compare-pyats-snapshot
    name: Compare Snapshot
    overview: Diff one or more Genie features between two snapshots via genie.utils.diff.Diff.
    description: >
      Compare a live pyATS snapshot (from an upstream Get Snapshot step) against a
      stored reference snapshot using Genie's own structure-aware diff instead of a
      plain text diff. Select one or more Genie features to compare; a device matches
      only when every selected feature is identical. Configure exclude_keys to ignore
      volatile fields (e.g. updated, uptime) that Genie does not ignore automatically.
    artifact_type: control_flow
    palette_category: pyats
    directory: compare_pyats_snapshot
    enabled: true
    requires: [identity, pyats_testbed]
    produces: [parsed]
    consumes: []
    primary_output: comparison_diff
    outcomes:
      - name: match
      - name: mismatch
      - name: failure
    metadata:
      configuration_input:
        - name: features
          description: >
            Genie feature names to compare (e.g. bgp, ospf, interface), selected
            as a checkbox group. All selected features are read from the same
            per-device live and reference snapshot files. A device routes to
            match only when every feature is identical, to mismatch when any
            feature differs, and to failure when any feature is absent or failed
            on either side.
          data_type: array
          required: true
          example: ["bgp", "ospf"]
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream Get Snapshot step producing the
            live snapshot.
          data_type: string
          required: true
        - name: parsed_output_key
          description: >
            Optional output_key from Get Snapshot, to disambiguate multiple
            snapshot keys.
          data_type: string
          required: false
        - name: exclude_keys
          description: >
            Dict keys to ignore during the diff (passed to Genie's
            Diff(..., exclude=[...])). Genie does not ignore volatile fields
            (e.g. updated, uptime, last_change) automatically -- list any keys
            whose values change on their own to avoid false mismatches.
          data_type: array
          required: false
          default: []
          example: ["updated", "last_change", "uptime"]
        - name: reference_location
          description: Where the reference snapshot JSON is stored (filesystem or git).
          data_type: string
          required: false
          default: filesystem
        - name: reference_subdirectory
          description: Subdirectory under DATA_DIRECTORY for filesystem references.
          data_type: string
          required: false
          default: pyats-snapshots
        - name: git_repository_id
          description: Git repository id from Settings → Git Repositories when reference_location is git.
          data_type: integer
          required: false
        - name: repository_subdirectory
          description: Optional path prefix inside the git repository before filename_template.
          data_type: string
          required: false
        - name: pull_before_read
          description: Pull latest changes once before reading a git reference file.
          data_type: boolean
          required: false
          default: false
        - name: filename_template
          description: >
            Per-device path to the reference snapshot JSON file -- must be JSON
            previously exported via a Store Artifact step from a Get Snapshot
            run's pyats_snapshot content. No {feature} placeholder.
          data_type: string
          required: true
          example: "{device.name}.pyats-snapshot.json"
        - name: comparison_diff_key
          description: >
            Parsed key written per device on mismatch ({node_id}.comparison_diff).
          data_type: string
          required: false

  - id: batfish-start-run
    name: Get from Batfish
    overview: List Batfish snapshot nodes as devices, or seed an empty placeholder context.
    description: >
      Three-way auto-detected behavior (see doc/BATFISH_INTEGRATION.md "Get
      from Batfish" for the full explanation): with no config and no
      upstream Init Batfish Snapshot metadata on this run, this step is a
      no-op placeholder -- it clears context.devices and does not contact
      Batfish at all, purely to satisfy the canvas's requires: [identity]
      connection rule for a git-mode Init Batfish Snapshot step that needs
      no live devices. Once this run's own Init Batfish Snapshot has
      recorded a snapshot, or when batfish_source_id + network target a
      standing network directly, this step instead queries that snapshot's
      nodeProperties and REPLACES context.devices with one device per node
      (deduplicated) -- the same "replace, don't merge" contract as other
      Get-from-X device-selection steps. A workflow may use two instances of
      this step: one before Init Batfish Snapshot (placeholder role), one
      after it (real device population).
    artifact_type: inventory_selector
    palette_category: batfish
    directory: batfish_start_run
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: nodes_filter
          description: >
            NodeSpecifier restricting which nodes are listed as devices
            (e.g. a regex like "/^r/" or a "node1|node2" alternation). Leave
            blank to list every node in the snapshot ("/.*/") -- unlike
            Extract Facts, this step has no context.devices of its own to
            default to, since it IS the device source.
          data_type: string
          required: false
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-init-snapshot
    name: Init Batfish Snapshot
    overview: Build a Batfish snapshot from this run's device configs.
    description: >
      Assembles the current run's device running-configs into a fresh Batfish
      snapshot and records its location for downstream Batfish query steps
      (Routing Table, Path Check, ACL Check). Not fan-out-safe -- like
      store-artifact/git steps, this must run after a Fan In in a fanned-out
      workflow, never inside the fanned-out branch (see
      doc/BATFISH_INTEGRATION.md "Snapshot lifecycle").
    artifact_type: persistent_artifact
    palette_category: batfish
    directory: batfish_init_snapshot
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: batfish_source_id
          description: Which configured Batfish source (Settings → Sources → Batfish) to use.
          data_type: string
          required: true
        - name: retain_snapshots
          description: >
            Keep only the N most recent snapshots for this workflow's Batfish
            network; older ones are deleted after a successful init.
          data_type: integer
          required: false
          default: 5
        - name: network_name
          description: >
            Override the Batfish network name to use verbatim instead of the
            default "manus-workflow-<workflow_id>" -- gives a network a
            stable identity independent of workflow_id, e.g. for a
            production network refreshed nightly by a Schedule.
          data_type: string
          required: false
        - name: config_source
          description: >
            Where to source device configs from: "live" (default) uses this
            run's devices and must run after a Fan In if fanned out. "git"
            reads already-collected configs from a Git repository instead
            and does not require any devices in context at all -- pair with
            an upstream Start Batfish Run step when no real device-selection
            step is needed.
          data_type: string
          required: false
          default: live
        - name: git_repository_id
          description: >
            Git repository (Settings → Git Repositories) to read configs
            from. Required when config_source is "git".
          data_type: integer
          required: false
        - name: base_path
          description: >
            Directory inside the repository to search from (blank = repo
            root). Only used when config_source is "git".
          data_type: string
          required: false
        - name: glob_pattern
          description: >
            Glob pattern (supports ** recursive segments) matched against
            files under base_path, e.g. "**/*.running.cfg" (filename-suffix
            convention) or "configs/running/**/*.cfg" (directory
            convention). Required when config_source is "git".
          data_type: string
          required: false

  - id: batfish-routing-table
    name: Batfish Routing Table
    overview: Look up routing table entries via Batfish's routes question.
    description: >
      Queries the routing table of an already-initialized Batfish snapshot
      (from an upstream Init Batfish Snapshot step). All filters are optional --
      an empty config returns every route on every node.
    artifact_type: configuration_management
    palette_category: batfish
    directory: batfish_routing_table
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: devices
    metadata:
      configuration_input:
        - name: nodes
          description: Restrict to nodes matching this specifier (e.g. a hostname).
          data_type: string
          required: false
        - name: network_prefix
          description: Restrict to routes matching this network prefix (e.g. 192.168.1.0/24).
          data_type: string
          required: false
        - name: prefix_match_type
          description: "Prefix match mode: EXACT (default) | LONGEST_PREFIX_MATCH | LONGER_PREFIXES | SHORTER_PREFIXES."
          data_type: string
          required: false
          default: EXACT
        - name: protocols
          description: Restrict to routes matching this routing-protocol specifier (e.g. static, bgp).
          data_type: string
          required: false
        - name: vrfs
          description: Restrict to VRFs matching this name or regex.
          data_type: string
          required: false
        - name: rib
          description: "Which protocol RIB to read from: main (default) | bgp | evpn."
          data_type: string
          required: false
          default: main
        - name: output_key
          description: Metadata key this step's result is stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_routes
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-node-properties
    name: Batfish Node Properties
    overview: Look up per-node configuration properties via Batfish's nodeProperties question.
    description: >
      Queries node-level configuration facts (e.g. TACACS/NTP/DNS/SNMP
      servers, hostname, VRFs, ACLs) of an already-initialized Batfish
      snapshot (from an upstream Init Batfish Snapshot step). Both filters
      are optional -- an empty config returns every default property column
      for every node.
    artifact_type: configuration_management
    palette_category: batfish
    directory: batfish_node_properties
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: devices
    metadata:
      configuration_input:
        - name: nodes
          description: Restrict to nodes matching this specifier (e.g. a hostname).
          data_type: string
          required: false
        - name: properties
          description: >
            NodePropertySpec restricting which property columns come back
            (comma-separated, e.g. "TACACS_Servers, TACACS_Source_Interface").
            Leave blank to return Batfish's own default column set. Required
            when route_empty_to_devices is enabled.
          data_type: string
          required: false
        - name: route_empty_to_devices
          description: >
            When enabled, the "devices" outcome is filtered to only the
            nodes whose requested properties are empty (e.g. an unconfigured
            TACACS server, which Batfish reports as TACACS_Servers: [] --
            not a missing row). Disabled (default), "devices" carries every
            matched node regardless of value. Requires "properties" to be
            set explicitly.
          data_type: boolean
          required: false
          default: false
        - name: empty_match_mode
          description: >
            Only load-bearing with more than one "properties" entry: "any"
            (default) flags a node if at least one requested property is
            empty; "all" flags it only if every requested property is empty.
          data_type: string
          required: false
          default: any
        - name: output_key
          description: Metadata key this step's result is stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_node_properties
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-interface-properties
    name: Batfish Interface Properties
    overview: Look up per-interface configuration properties via Batfish's interfaceProperties question.
    description: >
      Queries interface-level configuration facts (e.g. description, MTU,
