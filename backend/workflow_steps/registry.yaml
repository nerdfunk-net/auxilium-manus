  - id: batfish-path-check
    name: Batfish Path Check
    overview: Check whether a path exists between two devices via Batfish's reachability question.
    description: >
      Checks whether traffic matching the given header space can travel from
      start_node to end_node (or anywhere, if end_node is omitted) against an
      already-initialized Batfish snapshot. Routes to reachable or
      not_reachable depending on whether any matching flow was found -- an
      empty result is the valid negative answer, not an error.
    artifact_type: control_flow
    palette_category: batfish
    directory: batfish_path_check
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: reachable
      - name: not_reachable
    metadata:
      configuration_input:
        - name: start_node
          description: Node/nodeSpec to start the path from.
          data_type: string
          required: true
          example: R1
        - name: end_node
          description: Node/nodeSpec to end the path at. Omit to search any destination.
          data_type: string
          required: false
        - name: dst_ips
          description: Destination IP(s)/prefix to match.
          data_type: string
          required: false
        - name: src_ips
          description: Source IP(s)/prefix to match.
          data_type: string
          required: false
        - name: applications
          description: Named applications to match (e.g. SSH, TELNET, HTTP).
          data_type: array
          required: false
        - name: ip_protocols
          description: IP protocol(s) to match.
          data_type: string
          required: false
        - name: max_traces
          description: Limit the number of traces returned.
          data_type: integer
          required: false
        - name: invert_search
          description: Search for packet headers outside the specified header space, rather than inside it.
          data_type: boolean
          required: false
          default: false
        - name: ignore_filters
          description: Do not apply filters/ACLs during analysis.
          data_type: boolean
          required: false
          default: false
        - name: output_key
          description: Metadata key this step's result is stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_path_check
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-acl-check
    name: Batfish ACL Check
    overview: Check whether a specific flow is permitted by a named filter/ACL via Batfish's testFilters question.
    description: >
      Tests one concrete traffic flow (destination required; source/
      application/protocol optional) against a named filter on a node, using
      an already-initialized Batfish snapshot. Routes to permit or deny based
      on the filter's verdict.
    artifact_type: control_flow
    palette_category: batfish
    directory: batfish_acl_check
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: permit
      - name: deny
    metadata:
      configuration_input:
        - name: node
          description: Node/nodeSpec the filter is evaluated on.
          data_type: string
          required: true
          example: R1
        - name: filter_name
          description: Name/filterSpec of the ACL or firewall filter to test.
          data_type: string
          required: true
          example: TEST-ACL
        - name: dst_ips
          description: Destination IP(s)/prefix of the flow to test.
          data_type: string
          required: true
        - name: src_ips
          description: Source IP(s)/prefix of the flow to test.
          data_type: string
          required: false
        - name: applications
          description: Named applications to match (e.g. SSH, TELNET, HTTP).
          data_type: array
          required: false
        - name: ip_protocols
          description: IP protocol(s) to match.
          data_type: string
          required: false
        - name: start_location
          description: Location to start tracing the flow from.
          data_type: string
          required: false
        - name: output_key
          description: Metadata key this step's result is stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_acl_check
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-validate-facts
    name: Validate Facts
    overview: Check parsed device facts against expected values via Batfish's validate_facts question.
    description: >
      Compares expected configuration facts (hostname, NTP/TACACS/DNS
      servers, interfaces, BGP/OSPF settings, etc.) against what Batfish
      actually parsed from each device's config in an already-initialized
      snapshot. Expected facts come from an upstream Render Jinja Template
      step's rendered YAML (facts_source: rendered_yaml), a single
      fact_key/fact_value pair built inline (facts_source: field), or YAML
      files read from a Git repository (facts_source: git). Routes each
      device to match or mismatch; a device whose expected facts couldn't be
      resolved routes to failure instead.
    artifact_type: control_flow
    palette_category: batfish
    directory: batfish_validate_facts
    enabled: true
    requires: [identity]
    produces: [parsed]
    outcomes:
      - name: match
      - name: mismatch
      - name: failure
    metadata:
      configuration_input:
        - name: facts_source
          description: >
            Where each device's expected-facts YAML fragment comes from:
            "rendered_yaml" (default) reads an upstream Render Jinja
            Template step's output; "field" builds a single {fact_key:
            fact_value} fact inline, per device; "git" reads expected-facts
            YAML files from a Git repository, scoped to this run's devices.
          data_type: string
          required: false
          default: rendered_yaml
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream Render Jinja Template step
            producing the expected-facts YAML. Required when facts_source is
            "rendered_yaml". The rendered YAML must have a top-level "nodes"
            mapping keyed by this device's own name (case-insensitive).
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from Render Jinja Template, to disambiguate
            multiple rendered outputs on the same device.
          data_type: string
          required: false
        - name: fact_key
          description: >
            One supported Batfish fact key (e.g. TACACS_Servers, NTP_Servers,
            Hostname, Domain_Name -- see the Help tab for the full list).
            Required when facts_source is "field".
          data_type: string
          required: false
          example: TACACS_Servers
        - name: fact_value
          description: >
            Expected value for fact_key, as a Jinja template string rendered
            per device (e.g. "{{ nautobot.custom_fields.tacacs_servers }}").
            May resolve to a scalar or a YAML/JSON list, e.g. "10.0.0.1" or
            "[10.0.0.1, 10.0.0.2]". Required when facts_source is "field".
          data_type: string
          required: false
        - name: git_repository_id
          description: >
            Git repository (Settings → Git Repositories) to read
            expected-facts YAML from. Required when facts_source is "git".
          data_type: integer
          required: false
        - name: base_path
          description: >
            Directory inside the repository to search from (blank = repo
            root). Only used when facts_source is "git".
          data_type: string
          required: false
        - name: glob_pattern
          description: >
            Glob pattern (supports ** recursive segments) matched against
            expected-facts YAML files under base_path, e.g.
            "facts/**/*.yaml". Every matched file must have a top-level
            "nodes" mapping, keyed by hostname (case-insensitive), same
            shape as facts_source: rendered_yaml. Later files (sorted by
            path) win on a node-key collision. Required when facts_source is
            "git".
          data_type: string
          required: false
        - name: output_key
          description: >
            Metadata key this step's aggregate result is stored under
            ({node_id}.<output_key>); also the device.parsed key each
            device's own mismatch detail (if any) is written under.
          data_type: string
          required: false
          default: batfish_validate_facts
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: batfish-extract-facts
    name: Extract Facts
    overview: Pull parsed device facts out of a Batfish snapshot via Batfish's extract_facts question.
    description: >
      Retrieves the configuration facts Batfish parsed (hostname, NTP/
      TACACS/DNS servers, interfaces, BGP/OSPF settings, etc.) for a set of
      nodes in an already-initialized snapshot -- no expected values, just
      what Batfish actually sees. Writes each device's own facts into
      device.parsed[output_key] for downstream steps to read, in addition to
      one workflow-level artifact covering every extracted node.
    artifact_type: configuration_management
    palette_category: batfish
    directory: batfish_extract_facts
    enabled: true
    requires: [identity]
    produces: [parsed]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: nodes_filter
          description: >
            NodeSpecifier restricting which nodes to extract facts for (e.g.
            a regex like "/^r/" or "node1|node2" alternation). Leave blank
            to default to exactly this run's devices (by name, lowercased) --
            set to "/.*/" explicitly to extract every node in the snapshot.
          data_type: string
          required: false
        - name: output_key
          description: >
            device.parsed key each device's own extracted facts are written
            under, and the metadata key this step's aggregate result is
            stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_extract_facts
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
            most recently created snapshot in that network.
          data_type: string
          required: false

  - id: configure-replace-config
    name: Configure Replace Config
    overview: Apply a COMPLETE config file via 'configure replace' and confirm the change.
    description: >
      Replace the running config with a file already on the device using Cisco's
      'configure replace ... force time N' + 'configure confirm', with an
      automatic on-device rollback timer and optional pre/post config-text diffs.
      The file MUST be a complete device configuration -- a partial file fails the
      step; use Merge Config to layer a few lines instead. Requires an upstream
      Add Testbed step and config archiving enabled on the device. See the Help
      tab for the full failure model.
    artifact_type: command_execution
    palette_category: pyats
    directory: configure_replace_config
    enabled: true
    requires: [identity, pyats_testbed]
    produces: [parsed]
    consumes: []
    primary_output: configure_replace
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: destination_filename
          description: >
            Filename of the config file already present on the device (e.g.
            the destination_filename an upstream Upload Config step wrote).
          data_type: string
          required: true
          example: startup-config-new.cfg
        - name: file_system
          description: "Filesystem on the device where the file lives, e.g. bootflash: or nvram:."
          data_type: string
          required: true
          example: "bootflash:"
        - name: timeout_minutes
          description: >
            Minutes passed to 'configure replace ... time <n>' before the
            device automatically reverts the change if not confirmed. Whole
            number from 1 to 120 (device-enforced range).
          data_type: integer
          required: true
          default: 2
          example: 2
        - name: skip_if_no_pending_changes
          description: >
            Before replacing, diff the target file against the running
            config ('show archive config differences'). If there are no
            differences, skip 'configure replace'/'configure confirm'
            entirely and report success -- avoids cycling the device
            through a rollback timer for a no-op. A non-empty pre-diff is
            stored as an artifact but does not block the replace. If the
            diff command itself fails, the replace proceeds unverified.
          data_type: boolean
          required: false
          default: true
        - name: verify_diff_after_replace
          description: >
            After 'configure confirm' succeeds, diff the target file
            against the running config again. A non-empty diff means the
            running config still doesn't match the target despite the
            rollback timer being cancelled, so the device is failed and the
            diff is stored as an artifact. A failure to run the diff itself
            also fails the device, since the outcome can no longer be
            vouched for.
          data_type: boolean
          required: false
          default: true

  - id: get-from-list
    name: Get from List
    overview: Configure a static list of devices.
    description: >
      Enter one or more device names and/or IP addresses to use as workflow
      targets.
    artifact_type: inventory_selector
    directory: get_from_list
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: devices
          description: >
            Devices to include in the workflow. Each row may set a name, an IP
            address, or both — at least one is required per row. When an IP
            address is set it becomes the device's primary_ip4 and is used by
            downstream steps (Reachable, Get Device Configs, ...) to connect;
            otherwise the name is used as the hostname.
          data_type: object_list
          required: true
          example:
            - name: router1.example.com
            - ip_address: 10.0.0.5
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-from-user
    name: Get from User
    overview: Ask the operator for devices when the run starts.
    description: >
      Prompt the operator to enter one or more target devices when starting
      the workflow run.
    artifact_type: inventory_selector
    directory: get_from_user
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: device_param
          description: >
            Name of a workflow static_attribute (type "string") the operator
            fills in when starting a run. One device per line; each line is a
            hostname, an IP address, or "name,ip_address".
          data_type: string
          required: true
          example: target_devices
        - name: lookup_mode
          description: >
            UI hint only, never read by the executor. "manual" (default) shows
            a plain multi-line box in the Run Inputs dialog. "nautobot_search"
            adds a name-contains typeahead against nautobot_source_id; the
            operator can still type raw entries as a fallback.
          data_type: string
          required: false
          default: manual
          example: nautobot_search
        - name: nautobot_source_id
          description: >
            UI hint only, used solely to power Run Inputs dialog suggestions
            when lookup_mode is "nautobot_search". Not read by the executor.
          data_type: string
          required: false
          example: prod-lab
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-git-devices
    name: Get from Git
    overview: Select devices from Git inventory files.
    description: Select one or more target devices from the inventory.
    artifact_type: inventory_selector
    directory: get_git_devices
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: ID of a Git repository configured under Settings → Git Repositories.
          data_type: integer
          required: true
          example: 3
        - name: filename_pattern
          description: Pattern to identify relevant files in the Git repository.
          data_type: string
          required: true
          example: 'configs/*.yaml'
        - name: directory
          description: Directory inside the Git repository to search (blank = repo root).
          data_type: string
          required: false
          example: configs/
        - name: device_mapping
          description: Mapping that extracts device identifiers from file contents.
          data_type: object
          required: false
          example:
            device_id_field: hostname
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-from-config
    name: Get from Config
    overview: Find a device by searching Git-stored config files for text.
    description: Search config files in a Git source for matching text and add the device found.
    artifact_type: inventory_selector
    directory: get_from_config
    enabled: true
    requires: []
    produces: [identity]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: ID of a Git repository configured under Settings → Git Repositories.
          data_type: integer
          required: true
          example: 3
        - name: directory
          description: Directory inside the Git repository to search (blank = repo root).
          data_type: string
          required: false
          example: configs/
        - name: file_filter
          description: Glob pattern to restrict which files are searched (blank = all files).
          data_type: string
          required: false
          example: '*.cfg'
        - name: recursive
          description: Search subdirectories recursively.
          data_type: boolean
          required: false
        - name: include_history
          description: Also search historical commits for files with no current match.
          data_type: boolean
          required: false
        - name: search_text
          description: Text to search for inside files.
          data_type: string
          required: true
          example: 'snmp-server community'
        - name: case_sensitive
          description: Whether the text search is case-sensitive.
          data_type: boolean
          required: false
        - name: fan_out
          description: >
            Fan-out configuration. When enabled, each device (or chunk) is processed
            as an independent Hatchet child workflow instead of all devices sharing
            one workflow run.
          data_type: object
          required: false
          example:
            enabled: true
            mode: per_device
            chunk_size: 1
            max_concurrency: 0

  - id: get-nautobot-attributes
    name: Get Nautobot Attributes
    overview: Retrieve Nautobot attributes for selected devices.
    description: Retrieve attributes from Nautobot for selected devices.
    artifact_type: inventory_selector
    palette_category: nautobot
    directory: get_nautobot_attributes
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: nautobot_source_id
          description: ID of a Nautobot source configured under Settings → Sources.
          data_type: string
          required: true
          example: prod-lab
        - name: list_of_attributes
          description: List of Nautobot attributes to retrieve for each device.
          data_type: string_list
          required: true
          example:
            - location
            - role

  - id: set-default-attributes
    name: Set Default Attributes
    overview: Seed default Nautobot attributes for devices that don't have them yet.
    description: >
      Fill in default role/status/location/device type/tags/custom fields/interfaces
      into each device's Nautobot attribute bag, so {nautobot.origin} in Add to
      Nautobot / Update Device resolves without a live Nautobot lookup.
    artifact_type: inventory_selector
    palette_category: nautobot
    directory: set_default_attributes
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: type
          description: >
            Resource type these defaults apply to. Only "device" is implemented;
            "ip_address" and "ip_prefix" are reserved for a future release.
          data_type: string
          required: true
          example: device
        - name: mode
          description: >
            Where the default values come from: "manual" (the attributes panel below)
            or "git" (read a YAML file from a configured git repository).
          data_type: string
          required: true
          example: manual
        - name: overwrite
          description: >
            When true, a default replaces a value the device's nautobot attribute bag
            already has. When false, a field already present (non-empty) is left
            untouched — only missing fields are filled in.
          data_type: boolean
          required: false
          default: false
        - name: attributes
          description: >
            Manual-mode default values — role, status, location, platform,
            software_version, serial, asset_tag, tags, device_type (model +
            manufacturer), rack/face/position, custom_fields, and interfaces. Used
            only when mode is "manual".
          data_type: object
          required: false
          example:
            role: {enabled: true, value: Network}
            status: {enabled: true, value: Active}
        - name: git
          description: >
            Git-mode source — git_repository_id (from Settings → Git Repositories),
            filename_pattern (glob, e.g. "*.yaml"), and an optional directory to
            search within the repository. The matched file must contain a top-level
            "devices" mapping of default attribute values. Used only when mode is
            "git".
          data_type: object
          required: false
          example:
            git_repository_id: 3
            filename_pattern: defaults.yaml
            directory: ""

  - id: config-to-attributes
    name: Config to Attributes
    overview: Turn parsed device config into Nautobot attributes.
    description: >
      Read a device's parsed config — from Parse Cisco Config, Get & Parse
      Config (pyATS/Genie), or Extract Facts (Batfish) — and populate its
      Nautobot attribute bag with its interfaces, for later use by Add to
      Nautobot or Update Device (interfaces_source: nautobot_origin). Does
      not distinguish Layer 2 from Layer 3 interfaces — an interface is
      built whether it carries an IP address, a switchport VLAN, or is a
      port-channel/LAG. No live Nautobot connection is used. Optionally
      selects which interface's address becomes the device's Nautobot
      primary IPv4 — a Cisco config has no field for that — or verifies the
      device's already-known primary IPv4 is still present, routing devices
      that fail either check to the "failure" outcome.
    artifact_type: inventory_selector
    palette_category: nautobot
    directory: config_to_attributes
    enabled: true
    requires: [identity, parsed]
    produces: [attributes]
    consumes: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source_format
          description: >
            Which parser produced the config at parsed.<parsed_key> —
            cisco_config_parser (from Parse Cisco Config), genie (from
            Get & Parse Config), or batfish (from Extract Facts).
          data_type: string
          required: true
          example: cisco_config_parser
        - name: config_source
          description: >
            Which parsed config to read for attribute values — running or
            startup (exactly one). genie and batfish only ever populate
            running.
          data_type: string
          required: true
          example: running
        - name: parsed_key
          description: >
            The output_key used by the matching upstream step
            (parsed.<parsed_key>) — Parse Cisco Config, Get & Parse
            Config, or Extract Facts. Must match that step's own
            "output_key" configuration value.
          data_type: string
          required: true
          example: cisco_config
        - name: attributes
          description: >
            Which attribute groups to populate. Currently only
            "interfaces" is implemented; more groups will be added later.
            For cisco_config_parser, this merges the library's
            l3_interfaces, l2_access_interfaces, l2_trunk_interfaces, and
            port_channels sections into one interface list, keyed by
            interface name. Known limitation: an interface whose only
            configuration is "channel-group N mode X" (no IP, no
            switchport command) is invisible to the library outside of
            port_channels[].members — this step synthesizes a minimal
            entry for it (and for the port-channel interface itself, if
            also missing) with lag set, but cannot recover its
            description or shutdown state.
          data_type: object_list
          required: true
          example:
            - interfaces
        - name: update_primary_ipv4
          description: >
            When enabled, select one interface's address (by
            primary_ipv4_priority) to become the device's Nautobot primary
            IPv4, and route a device to the "failure" outcome if no
            strategy matches. When disabled (default), the device's
            already-known primary IPv4 (its inventory-sourced primary_ip4)
            is instead verified against the parsed interfaces and
            re-affirmed if still present — a device whose current primary
            IPv4 has disappeared from the config is routed to "failure".
            A device with no known primary_ip4 and this disabled is passed
            through unchanged. Interfaces are always written either way —
            only primary-IPv4 selection is gated by this flag.
          data_type: boolean
          required: false
          example: true
        - name: primary_ipv4_priority
          description: >
            Only used when update_primary_ipv4 is enabled. Ordered list —
            tried top to bottom, first match wins — of exactly these four
            strategies, each exactly once: management_interface (first
            interface whose name starts with "Management" or "Mgmt",
            case-insensitive), loopback_highest (Loopback interface with
            the highest numeric suffix, e.g. Loopback100 over Loopback0),
            loopback_lowest (lowest numeric suffix, e.g. Loopback0 over
            Loopback100), custom_interface (first interface whose name
            matches primary_ipv4_custom_pattern). A secondary IP address on
            an interface is never selected.
          data_type: string_list
          required: false
          example:
            - management_interface
            - loopback_highest
            - loopback_lowest
            - custom_interface
        - name: primary_ipv4_custom_pattern
          description: >
            Regular expression (case-insensitive, re.search semantics)
            matched against interface names for the custom_interface
            strategy in primary_ipv4_priority. Only used when
            update_primary_ipv4 is enabled and custom_interface is reached;
            an empty pattern means that strategy never matches.
          data_type: string
          required: false
          example: ^Vlan1$

  - id: add-to-nautobot
    name: Add to Nautobot
    overview: Create a new device in Nautobot.
    description: >
      Create each device in Nautobot with its required attributes, plus optional
      interfaces, rack placement, and virtual chassis membership.
    artifact_type: command_execution
    palette_category: nautobot
    directory: add_to_nautobot
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: nautobot_source_id
          description: ID of a Nautobot source configured under Settings → Sources.
          data_type: string
          required: true
          example: prod-lab
        - name: device_fields
          description: >
            Device fields. name/role/status/location/device_type are required and
            accept a fixed value, {path.to.value}, {expr | default('x')}, or
            {nautobot.origin} (pull straight from the device's nautobot attribute
            bag, e.g. when the same device was already read via Get Nautobot
            Attributes, or seeded by Set Default Attributes). platform/
            software_version/serial/asset_tag/tags default to enabled with
            {nautobot.origin} too, but — unlike the required fields — can be
            unchecked; custom_fields/rack/face/position are optional and start
            unchecked, and are only sent to Nautobot when enabled.
          data_type: object
          required: true
          example:
            name: "{parsed.cisco_config.running.hostname}"
            role: "{nautobot.origin}"
            status: "{nautobot.origin | default('Active')}"
            location: "{nautobot.origin}"
            device_type: "{nautobot.origin}"
            platform: "{nautobot.origin}"
            software_version: "{nautobot.origin}"
            serial: "{nautobot.origin}"
            asset_tag: "{nautobot.origin}"
            tags: "{nautobot.origin}"
        - name: custom_fields_source
          description: >
            "manual" (default) sends only the custom_fields rows configured under
            device_fields. "nautobot_origin" ignores those rows and instead sends
            every custom field present in the device's nautobot attribute bag —
            useful when the set of custom fields varies per device and isn't known
            in advance (e.g. seeded by Set Default Attributes or Get Nautobot
            Attributes).
          data_type: string
          required: false
          default: manual
        - name: interfaces
          description: Interfaces to create on the new device, including IP address and description.
          data_type: object_list
          required: false
          example:
            - name: GigabitEthernet0/0
              type: 1000base-t
              status: active
              ip_address: 10.0.0.1/24
        - name: interfaces_source
          description: >
            "manual" (default) creates only the interfaces listed above. "nautobot_origin"
            ignores that list and instead creates every interface present in the
            device's nautobot attribute bag, each with however many IP addresses it
            has (the bag's plural ip_addresses per interface) — useful when the
            number of interfaces varies per device and isn't obvious before the
            workflow runs.
          data_type: string
          required: false
          default: manual
        - name: add_prefix
          description: Automatically create missing IP prefixes when assigning addresses.
          data_type: boolean
          required: false
          default: true
        - name: default_prefix_length
          description: Default prefix length when creating prefixes.
          data_type: string
          required: false
          default: /24
        - name: virtual_chassis
          description: >
            Optional virtual chassis membership. mode "none" (default), "join" (set
            id to an existing virtual chassis UUID), or "create" (set name; the new
            device becomes master at position 1). Joining an existing chassis under
            fan-out with other children joining the same chassis concurrently is a
            known race on position assignment — prefer running such devices
            sequentially (max_concurrency: 1) or through separate runs.
          data_type: object
          required: false
          example:
            mode: none
        - name: dry_run
          description: >
            Validate the resolved fields against Nautobot (duplicate name check,
            UUID existence checks) without creating the device.
          data_type: boolean
          required: false
          default: false

  - id: update-nautobot-device
    name: Update Device
    overview: Update Nautobot device fields, interfaces, and tags.
    description: Update device attributes, interfaces, tags, and custom fields in Nautobot.
    artifact_type: command_execution
    palette_category: nautobot
    directory: update_nautobot_device
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: nautobot_source_id
          description: ID of a Nautobot source configured under Settings → Sources.
          data_type: string
          required: true
          example: prod-lab
        - name: device_identifier
          description: >
            How to identify the device. Use from_context for workflow devices, or
            explicit with id or name when running standalone.
          data_type: object
          required: false
          example:
            mode: from_context
        - name: update_fields
          description: >
            Device fields to update. Only non-empty values are sent to Nautobot.
          data_type: object
          required: false
          example:
            status: active
            location: dc1
        - name: interfaces_source
          description: >
            Where to read interfaces from — manual (the interfaces list below)
            or nautobot_origin (every interface in the device's nautobot
            attribute bag, populated by an upstream Config to Attributes
            step). Incompatible with device_identifier.mode "explicit".
          data_type: string
          required: false
          default: manual
        - name: interfaces
          description: >
            Interfaces to create or update, including IP address and
            description. Ignored when interfaces_source is nautobot_origin.
          data_type: object_list
          required: false
          example:
            - name: GigabitEthernet0/0
              description: Uplink
              ip_address: 10.0.0.1/24
              namespace: Global
        - name: add_prefix
          description: Automatically create missing IP prefixes when assigning addresses.
          data_type: boolean
          required: false
          default: true
        - name: default_prefix_length
          description: Default prefix length when creating prefixes.
          data_type: string
          required: false
          default: /24
        - name: sync_interfaces
          description: Delete device interfaces not listed in the interfaces configuration.
          data_type: boolean
          required: false
          default: false

  - id: update-config-context
    name: Update Config Context
    overview: Add or update a Nautobot device's local config context.
    description: Write, update, or append values in a device's local config context in Nautobot.
    artifact_type: command_execution
    palette_category: nautobot
    directory: update_config_context
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: nautobot_source_id
          description: ID of a Nautobot source configured under Settings → Sources.
          data_type: string
          required: true
          example: prod-lab
        - name: device_identifier
          description: >
            How to identify the device. Use from_context for workflow devices, or
            explicit with id or name when running standalone.
          data_type: object
          required: false
          example:
            mode: from_context
        - name: mode
          description: >
            write replaces the entire local config context. update sets a value at
            an existing json path, leaving everything else untouched. append adds a
            new key at a json path, merging into an existing object there without
            disturbing its other keys — or, with an empty path, merges the resolved
            value's own top-level keys directly into the document root.
          data_type: string
          required: true
          default: write
          example: update
        - name: path
          description: >
            Dotted path into local_config_context_data, with numeric segments for
            list items (for example credentials.0.password or tacacs). Required for
            update; ignored for write. Optional for append — leave empty to merge the
            resolved value's own top-level keys directly into the document root
            instead of nesting them under a new key. List indices must already
            exist — lists are never extended.
          data_type: string
          required: false
          example: credentials.0.password
        - name: value_source
          description: >
            Where the new value comes from: an existing device attribute (by dotted
            path), or a rendered stored template. For mode write, the resolved value
            must be a JSON object.
          data_type: object
          required: true
          example:
            type: attribute
            attribute_path: tacacs.shared_secret

  - id: get-device-configs
    name: Get Configs
    overview: Get device configuration in the chosen format.
    description: Get device configuration in the specified format.
    artifact_type: configuration_management
    directory: get_device_configs
    enabled: true
    requires: [identity]
    produces: [running_config, startup_config]
    primary_output: running_config
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: config_format
          description: Format of the configuration to retrieve.
          data_type: string
          required: false
          default: both
          example: both

  - id: read-config
    name: Read Config
    overview: Load a saved config from disk or git and use it as the device's running config.
    description: >
      Read a configuration file from disk or a Git source, located by a per-device filename
      template, and set it as the device's running configuration — for restoring a known-good
      backup onto a device that has no reachable config of its own.
    artifact_type: configuration_management
    directory: read_config
    enabled: true
    requires: [identity]
    produces: [running_config]
    consumes: []
    primary_output: running_config
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source
          description: Where to read the config file from.
          data_type: string
          required: true
          default: filesystem
          example: git
        - name: git_repository_id
          description: >
            ID of a Git repository configured under Settings → Git Repositories.
            Required when source is git; ignored otherwise.
          data_type: integer
          required: false
          example: 3
        - name: path_template
          description: >
            Relative file path to read, resolved per device. Supports {device.name},
            {device.hostname}, {device.primary_ip4}, {nautobot.location.name},
            {nautobot.role.name}, {nautobot.custom_fields.<slug>}, {git.source_file}, and may
            include subdirectories.
          data_type: string
          required: true
          default: "{device.name}.cfg"
          example: "{nautobot.location.name}/{device.name}.cfg"
        - name: overwrite_existing
          description: >
            Overwrite a running config already present on the device context (e.g. from an
            upstream Get Configs step). When false (default), a device that already has a
            running config is left unchanged and this step does not read anything for it.
          data_type: boolean
          required: false
          default: false

  - id: run-command
    name: Run Command
    overview: Execute CLI commands on connected devices.
    description: Execute one or more CLI commands on connected devices.
    artifact_type: command_execution
    directory: run_command
    enabled: true
    requires: [identity]
    produces: [parsed]
    primary_output: command_output
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: commands
          description: CLI commands to execute in order.
          data_type: string_list
          required: true
          example:
            - show version
            - show running-config
        - name: parser
          description: >
            Which parser (if any) normalizes command output into structured data:
            "none" (default, raw text only), "textfsm" (netmiko/ntc-templates), or
            "genie" (via the pyATS shim — only available when a pyATS source is
            configured under Settings → Sources). Whichever is selected, the parsed
            result lands inline at the same location — parsed.<parsed_output_key>.
            <command> = {parsed, error} — so downstream steps (Route on Attribute,
            Jinja templates, Log Attributes) never need to know which parser
            produced it. parser must be "none" when execution_mode is "config_mode"
            or auto_confirm_prompts is enabled — the two are mutually exclusive.
          data_type: string
          required: false
          default: none
          example: textfsm
        - name: network_driver_override
          description: Override the Netmiko device type for all devices in this step.
          data_type: string
          required: false
          example: cisco_ios
        - name: pyats_source_id
          description: >
            ID of a pyATS source configured under Settings → Sources. Required when
            parser is "genie".
          data_type: string
          required: false
          example: lab-pyats
        - name: parsed_output_key
          description: >
            Unique key for this step's parsed output on each device (used by
            downstream Route on Attribute, Jinja templates, and Log Attributes as
            parsed.<parsed_output_key>.<command>.parsed). Nested per command.
            Only used when parser is not "none".
          data_type: string
          required: false
          default: parsed
        - name: execution_mode
          description: >
            How commands are sent to the device: exec_mode (default — send each
            command individually as an exec-level command, today's only behavior) or
            config_mode (enter configuration mode once, send every command, then
            exit). parser must be "none" when execution_mode is config_mode.
          data_type: string
          required: false
          default: exec_mode
          example: config_mode
        - name: write_config_after_execution
          description: >
            After a successful config_mode run, run "copy running-config
            startup-config" and confirm the prompt automatically. Only valid when
            execution_mode is config_mode — an error otherwise.
          data_type: boolean
          required: false
          default: false
        - name: read_timeout
          description: >
            Seconds to wait for each command's response before failing with a
            Netmiko "Pattern not detected" timeout. Applies in both exec_mode and
            config_mode. On a config_mode failure, the raw Netmiko session log up to
            the failure is stored as an artifact for diagnosis.
          data_type: integer
          required: false
          default: 60
          example: 120
        - name: auto_confirm_prompts
          description: >
            RISK: when a command triggers a Cisco-style interactive confirmation
            (e.g. "...Do you want to continue? [confirm]"), automatically press
            Enter to accept it instead of failing. Disabled by default. parser must
            be "none" when this is enabled. Any command actually confirmed this way
            is recorded in the step's output summary and worker logs.
          data_type: boolean
          required: false
          default: false
        - name: dry_run
          description: >
            When enabled, this step does not send any commands to devices — it
            only records what would happen. For each device, writes an entry to
            dry_run_results.<this step's node id> describing the commands and
            execution_mode that would have run. No command_results entry is
            created and no artifacts are stored for that device on this step.
            Visible in the run's detail view under the device's Dry Run section.
          data_type: boolean
          required: false
          default: false

  - id: merge-config
    name: Merge Config
    overview: Merge a partial config file into a device's running config over SSH.
    description: >
      Merge a partial configuration file already staged on the device (e.g. by an
      upstream Upload Config step) into the running config by issuing Cisco IOS
      'copy <source_filename> running-config' over SSH and answering the
      'Destination filename [running-config]? ' prompt with Enter. The file's
      lines are layered onto the running config in the device's non-interactive
      batch mode; lines already on the device that the file omits are left
      untouched. Use this for a partial file -- a rendered template covering only
      a few sections, an ACL snippet, a handful of interfaces. This is an additive
      merge with no rollback timer -- use Configure Replace Config when the file
      is a complete device configuration that should replace the running config
      wholesale. A device fails if the copy reports '%Error', 'Invalid
      input' or '%Warning', if it has no hostname / IP, on SSH connect / auth
      failure, or if prompts never clear.
    artifact_type: command_execution
    directory: merge_config
    enabled: true
    requires: [identity]
    produces: []
    consumes: []
    primary_output: command_output
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param -- a workflow
            static_attribute of type "reference", ref_kind "credential" -- resolved per
            triggering user (their private credential wins over a global one of the same
            name).
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: source_filename
          description: >
            Path to the partial config file already on the device, as passed to
            'copy <source_filename> running-config' (device filesystem prefix included).
            The file is assumed to have been placed there by an upstream Upload Config
            step.
          data_type: string
          required: true
          example: "flash:partial.cfg"
        - name: network_driver_override
          description: Override the Netmiko device type for all devices in this step.
          data_type: string
          required: false
          example: cisco_ios
        - name: read_timeout
          description: >
            Seconds to wait for each prompt / the device's response before failing with a
            Netmiko "Pattern not detected" timeout. Raise for large files or slow devices.
          data_type: integer
          required: false
          default: 60
          example: 120

  - id: deploy-rendered-template
    name: Deploy rendered Template
    overview: Push a rendered template's commands to connected devices.
    description: >
      Execute the commands produced by a Render Jinja Template step on connected
      devices, optionally saving the running configuration afterward.
    artifact_type: command_execution
    directory: deploy_rendered_template
    enabled: true
    requires: [identity]
    produces: []
    primary_output: command_output
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: source_step_node_id
          description: >
            Canvas node id of the Render Jinja Template step whose rendered
            output should be deployed.
          data_type: string
          required: true
        - name: parsed_output_key
          description: >
            Optional output_key from the render step. Leave empty to use the
            template produced by the selected step.
          data_type: string
          required: false
        - name: execution_mode
          description: >
            How rendered lines are sent to the device: config_mode (enter
            configuration mode once, send every line, exit config mode) or
            exec_mode (send each line individually as an exec-level command,
            like Run Command).
          data_type: string
          required: false
          default: config_mode
          example: config_mode
        - name: network_driver_override
          description: Override the Netmiko device type for all devices in this step.
          data_type: string
          required: false
          example: cisco_ios
        - name: write_config_after_execution
          description: >
            After a successful deployment, run "copy running-config
            startup-config" and confirm the prompt automatically.
          data_type: boolean
          required: false
          default: false
        - name: read_timeout
          description: >
            Seconds to wait for each command's response before failing with a
            Netmiko "Pattern not detected" timeout. Raise this if commands
            that produce slow, multi-line, or confirmation-prompt output are
            timing out. On failure, the raw Netmiko session log up to the
            failure is stored as an artifact for diagnosis.
          data_type: integer
          required: false
          default: 60
          example: 120
        - name: auto_confirm_prompts
          description: >
            RISK: when a command triggers a Cisco-style interactive
            confirmation (e.g. "This operation will remove all username
            related configurations... Do you want to continue? [confirm]"),
            automatically press Enter to accept it instead of failing.
            Disabled by default — enable only when every command in the
            rendered template is expected and safe to auto-accept. Any
            command actually confirmed this way is recorded in the step's
            output summary and worker logs.
          data_type: boolean
          required: false
          default: false
        - name: dry_run
          description: >
            When enabled, this step resolves the rendered template but does not
            deploy it to devices. For each device, writes an entry to
            dry_run_results.<this step's node id> describing the commands and
            execution_mode that would have been deployed. No command_results
            entry is created and no artifacts are stored for that device on this
            step. Visible in the run's detail view under the device's Dry Run
            section.
          data_type: boolean
          required: false
          default: false

  - id: route-on-attribute
    name: Route on Attribute
    overview: Branch workflow paths by attribute value.
    description: Split devices onto different paths by matching an attribute value.
    artifact_type: control_flow
    palette_category: routing
    directory: route_on_attribute
    enabled: true
    requires: [identity]
    produces: [identity]
    outcomes:
      - name: ios
      - name: nxos
      - name: unmatched
    metadata:
      configuration_input:
        - name: attribute_path
          description: >
            Dot path to the attribute to match. Use device.* for core fields
            (device.network_driver), bag paths for enriched attributes
            (nautobot.role.name, git.filename, custom.field), or parsed.* for a
            step's inline parsed output — parsed.cisco_config.running.hostname
            from Parse Cisco Config, or parsed.<parsed_output_key>.<command>.parsed
            from Run Command when its parser is "textfsm" or "genie" (see
            doc/WORKFLOW-STEPS.md). Filter Output and Render Jinja Template write
            only artifact-ref metadata to parsed.*, not literal content — not
            usable here. A parsed.* leaf holding a list or dict (e.g.
            parsed.cisco_config.running.aaa_servers.servers) can't be matched as
            a literal value, but {exists}/{empty}/{absent} still work to route
            on whether it's populated. A list can only be indexed with the
            field[key=value] filter form, not a numeric index.
          data_type: string
          required: true
          example: device.network_driver
        - name: routes
          description: >
            Ordered route rules. The first matching route wins. Each route maps
            attribute values to an outcome handle name.
          data_type: object_list
          required: true
          example:
            - outcome: ios
              values: [cisco_ios, ios]
            - outcome: nxos
              values: [cisco_nxos, nxos]
        - name: default_outcome
          description: >
            Outcome for devices with a missing or unmatched attribute value.
            When omitted, unmatched devices fail the step.
          data_type: string
          required: false
          example: unmatched
        - name: case_sensitive
          description: When false, route value matching ignores letter case.
          data_type: boolean
          required: false
          default: false

  - id: list-contains
    name: List Contains
    overview: Check whether a value is present anywhere in a parsed list.
    description: >
      Check whether a specific value — or a specific field of each item — appears
      in a list resolved from device context, e.g. whether a given TACACS+ server
      is among a device's parsed AAA servers. No Jinja template required.
    artifact_type: control_flow
    palette_category: routing
    directory: list_contains
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: membership
    outcomes:
      - name: match
      - name: mismatch
      - name: failure
    metadata:
      configuration_input:
        - name: list_path
          description: >
            Dot path to the list to search. Supports device.* scalars, bag paths
            (nautobot.tags), and parsed.* for a step's parsed output (e.g.
            parsed.cisco_config.running.aaa_servers.servers). Must resolve to a
            list; devices where it isn't populated, or resolves to something
            other than a list, route to failure. A segment can also filter a
            list down to one matching item before continuing, using
            key[field=value] — e.g.
            parsed.cisco_config.running.access_lists[name=MGMT_100].entries
            resolves to just the MGMT_100 ACL's entries, so field/value below can
            check whether it permits one specific source IP, not just whether any
            ACL has any entry.
          data_type: string
          required: true
          example: parsed.cisco_config.running.access_lists[name=MGMT_100].entries
        - name: field
          description: >
            Optional dot path within each list item to compare (for a list of
            objects, e.g. source, or a nested source.ip). Leave empty to compare
            each list item directly (for a list of plain strings/numbers, e.g.
            a VLAN id list).
          data_type: string
          required: false
          example: source
        - name: value
          description: >
            The value to look for. Use a fixed value, or wrap a dot path in
            braces to resolve it per device, e.g. {custom.expected_tacacs_ip},
            optionally with a fallback: {custom.expected_tacacs_ip | default('10.0.0.5')}.
            A device whose value expression resolves to nothing routes to failure.
          data_type: string
          required: true
          example: "172.16.9.100"
        - name: case_sensitive
          description: When false, value comparison ignores letter case.
          data_type: boolean
          required: false
          default: false

  - id: route-on-content
    name: Route on Content
    overview: Branch workflow paths by searching content for text or a pattern.
    description: >
      Search device content for fixed text or a regular expression and branch
      on whether it was found.
    artifact_type: control_flow
    palette_category: routing
    directory: route_on_content
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: content_match
    outcomes:
      - name: match
      - name: mismatch
      - name: failure
    metadata:
      configuration_input:
        - name: content_source
          description: >
            Which device content to search (running_config, startup_config,
            command_output, latest_command_output, rendered_template,
            merged_content, filtered_output, comparison_diff).
          data_type: string
          required: true
          example: running_config
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream step, required when content_source
            is command_output, rendered_template, merged_content,
            filtered_output, or comparison_diff.
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from render-jinja-template when
            content_source is rendered_template.
          data_type: string
          required: false
        - name: match_mode
          description: >
            "fixed_text" for a literal substring search, or "regex" for a
            regular expression.
          data_type: string
          required: true
          default: fixed_text
        - name: pattern
          description: >
            Text or regular expression to search for. Supports
            {path.to.attribute} placeholders resolved per device (e.g.
            {nautobot.tacacs_ip}); in regex mode, resolved placeholder values
            are regex-escaped before being spliced into the pattern.
          data_type: string
          required: true
          example: "tacacs-server|tacacs server"
        - name: case_sensitive
          description: When false, matching ignores letter case.
          data_type: boolean
          required: false
          default: false
        - name: multiline
          description: >
            Regex only. When true, ^ and $ match at line boundaries within
            the content instead of only the start/end of the whole text.
            Ignored in fixed_text mode.
          data_type: boolean
          required: false
          default: false

  - id: reachable
    name: Reachable
    overview: Ping devices to check whether they respond.
    description: >
      Ping each device and route it to success or failure based on how many
      ICMP replies are received within the configured timeout.
    artifact_type: control_flow
    palette_category: routing
    directory: reachable
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: reachability
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: ping_count
          description: How many ICMP echo requests to send to each device.
          data_type: integer
          required: true
          default: 4
        - name: required_replies
          description: >
            Minimum number of replies that must be received for the device to
            be considered reachable. Cannot exceed ping_count.
          data_type: integer
          required: true
          default: 1
        - name: timeout_seconds
          description: How long to wait for each individual ping reply, in seconds.
          data_type: number
          required: true
          default: 2

  - id: login-successful
    name: Login Successful
    overview: Verify SSH login with a configured credential.
    description: >
      Performs a new SSH login attempt without closing any existing workflow
      device session, and routes to success or failure based on whether
      authentication succeeds. Any existing session for the same device
      remains available to undo changes.
    artifact_type: control_flow
    palette_category: routing
    directory: login_successful
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: login
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: network_driver_override
          description: Override the Netmiko device type for all devices in this step.
          data_type: string
          required: false
          example: cisco_ios

  - id: read-from-file
    name: Read from File
    overview: Load a YAML or JSON file into the device attribute bag.
    description: >
      Read a YAML or JSON file from the local export directory or a Git repository,
      parse it once, and deep-merge the resulting mapping into every device's attribute
      bag at a configurable destination path — so a later Render Jinja Template step can
      reference the structured data (e.g. {{ data.region }}). Nested objects merge
      key-by-key; lists are replaced wholesale. When overwrite is false (default),
      keys already present at the destination are kept and only new keys are added.
      Fan-out note: in git mode the shared local working tree is refreshed (clone/pull)
      once per branch, so concurrent fan-out children reading the same repository can
      contend on the git lock; the merge itself is per-device and side-effect free.
      Prefer filesystem mode, or read the file before fan-out / after fan-in, when many
      branches target the same repository.
    artifact_type: control_flow
    palette_category: attributes
    directory: read_from_file
    enabled: true
    requires: [identity]
    produces: [attributes]
    consumes: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source
          description: >
            Where to read the file from: "filesystem" (the default export directory,
            Settings → General) or "git" (a repository under Settings → Git Repositories).
          data_type: string
          required: true
          default: filesystem
          example: git
        - name: git_repository_id
          description: >
            ID of a Git repository configured under Settings → Git Repositories.
            Required when source is git; ignored otherwise.
          data_type: integer
          required: false
          example: 3
        - name: path
          description: >
            Relative path of the file within the export directory or the Git repository,
            e.g. "data/site-defaults.yaml". May include subdirectories; must stay inside
            the root.
          data_type: string
          required: true
          example: data/site-defaults.yaml
        - name: format
          description: >
            How to parse the file: "yaml", "json", or "auto" (default; picks by file
            extension, otherwise tries JSON then YAML). The YAML parser also reads JSON.
          data_type: string
          required: false
          default: auto
          example: yaml
        - name: destination_path
          description: >
            Dotted bag[.field...] path the parsed mapping is deep-merged into, e.g.
            "data" or "data.site". The first segment is the attribute bag name and may
            not be a reserved namespace (parsed, run_input) or a device.* scalar field.
          data_type: string
          required: true
          default: data
          example: data.site
        - name: overwrite
          description: >
            When true, a key from the file replaces a key already present at the
            destination (nested dicts still merge key-by-key; lists are replaced
            wholesale). When false (default), existing keys are kept and only new keys
            are added.
          data_type: boolean
          required: false
          default: false

  - id: update-attribute
    name: Update Attribute
    overview: Set or transform device attributes in the workflow.
    description: >
      Set or transform one or more in-workflow device attributes using a fixed
      value or a regular expression with capture groups.
    artifact_type: control_flow
    palette_category: attributes
    directory: update_attribute
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: attributes
          description: >
            Ordered list of attribute updates. Each entry has a mode (fixed or
            regex), destination_path, and mode-specific fields (fixed_value, or
            source_path / pattern / destination_template / regex_flags). Updates
            run in list order for every device. source_path may read a scalar
            leaf from a step's parsed output (e.g.
            parsed.cisco_config.running.hostname), but destination_path may not target
            parsed.* — that namespace is populated only by step executors
            (parse-cisco-config, render-jinja-template, ...), not by this step.
          data_type: object_list
          required: true
          example:
            - mode: fixed
              destination_path: custom.location
              fixed_value: office-a
            - mode: regex
              source_path: device.name
              destination_path: custom.datacenter
              pattern: ^([^-]+)-
              destination_template: DC-\\1
              regex_flags:
                case_insensitive: false
                multiline: false
                dotall: false

  - id: encrypt-attribute
    name: Encrypt Attribute
    overview: Encrypt an attribute value with a shared secret.
    description: >
      Encrypt a cleartext attribute value using a shared secret from the
      credential vault and write the portable ciphertext token to a
      destination attribute path (for later persistence to disk or git).
    artifact_type: control_flow
    palette_category: secrets
    directory: encrypt_attribute
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source_path
          description: Dot path to the cleartext attribute value to encrypt.
          data_type: string
          required: true
          example: run_input.enable_password
        - name: destination_path
          description: >
            Dot path where the ciphertext token is written. Uses bag.field
            form; parsed.* / run_input.* are reserved and rejected.
          data_type: string
          required: true
          example: secrets.enable_password_enc
        - name: credential_reference
          description: >
            Name of a shared-secret credential in the vault. The passphrase is
            never stored in the workflow.
          data_type: credential_ref
          required: true
          example: config-context-vault
        - name: algorithm
          description: >
            Optional algorithm override. Blank uses the credential's configured
            algorithm.
          data_type: string
          required: false
          example: aes-256-gcm

  - id: decrypt-attribute
    name: Decrypt Attribute
    overview: Decrypt an attribute value with a shared secret.
    description: >
      Decrypt an encrypted attribute value using a shared secret from the
      credential vault and store the cleartext as a sealed secret for
      downstream steps (render a template, deploy to a device).
    artifact_type: control_flow
    palette_category: secrets
    directory: decrypt_attribute
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source_path
          description: Dot path to the encrypted attribute value (ciphertext token).
          data_type: string
          required: true
          example: nautobot.config_context.secrets.enable_password
        - name: destination_path
          description: >
            Dot path where the decrypted value is written, sealed. Uses
            bag.field form; parsed.* / run_input.* are reserved and rejected.
            Required in scalar mode; optional in list mode (blank rewrites the
            source list in place).
          data_type: string
          required: false
          example: secrets.enable_password
        - name: item_field
          description: >
            Blank = scalar mode (source_path is one token). Set to a field name
            for list mode: source_path resolves to a list and this field is
            decrypted, sealed, on every entry that carries a token.
          data_type: string
          required: false
          example: password
        - name: credential_reference
          description: >
            Name of a shared-secret credential in the vault. The passphrase is
            never stored in the workflow.
          data_type: credential_ref
          required: true
          example: config-context-vault
        - name: algorithm
          description: >
            Optional algorithm override. Blank trusts the token's own
            algorithm header / the credential's configured algorithm.
          data_type: string
          required: false
          example: aes-256-gcm

  - id: label
    name: Label
    overview: Place styled text on the workflow canvas.
    description: >
      Canvas decoration — configurable text with size, font, and color.
      Not executed at runtime and cannot be connected to other steps.
    artifact_type: canvas_decoration
    palette_category: debug
    directory: label
    enabled: true
    executable: false
    requires: []
    produces: []
    outcomes: []
    metadata:
      configuration_input:
        - name: text
          description: Text shown on the canvas.
          data_type: string
          required: true
          example: "Phase 1 — inventory"
        - name: font_size
          description: Font size in pixels.
          data_type: number
          required: true
          default: 16
          example: 16
        - name: font_family
          description: Font family — sans, serif, or mono.
          data_type: string
          required: true
          default: sans
          example: sans
        - name: bold
          description: When true, render the label text in bold.
          data_type: boolean
          required: false
          default: false
        - name: color
          description: Text color as a hex string (e.g. #0f172a).
          data_type: string
          required: true
          default: "#0f172a"
          example: "#0f172a"
        - name: width
          description: Label box width in pixels.
          data_type: number
          required: true
          default: 200
          example: 200
        - name: height
          description: Label box height in pixels.
          data_type: number
          required: true
          default: 40
          example: 40

  - id: background
    name: Background
    overview: Place a colored rectangle behind other canvas steps.
    description: >
      Canvas decoration — a colored rectangle always drawn behind other
      steps. Configure size and color. Not executed at runtime and cannot
      be connected to other steps.
    artifact_type: canvas_decoration
    palette_category: debug
    directory: background
    enabled: true
    executable: false
    requires: []
    produces: []
    outcomes: []
    metadata:
      configuration_input:
        - name: color
          description: Fill color as a hex string (e.g. #e2e8f0).
          data_type: string
          required: true
          default: "#e2e8f0"
          example: "#e2e8f0"
        - name: width
          description: Rectangle width in pixels.
          data_type: number
          required: true
          default: 480
          example: 480
        - name: height
          description: Rectangle height in pixels.
          data_type: number
          required: true
          default: 320
          example: 320

  - id: funnel
    name: Funnel
    overview: Merge many connections into one before a shared destination.
    description: >
      Canvas decoration — accepts edges from many upstream steps and routes
      them through a single downstream connection, reducing visual clutter
      for fan-in patterns like Notify On Error. Not executed at runtime;
      each incoming edge is resolved directly between its real source and
      the funnel's one destination before execution.
    artifact_type: canvas_decoration
    palette_category: debug
    directory: funnel
    enabled: true
    executable: false
    requires: []
    produces: []
    outcomes: []

  - id: log-message
    name: Log Message
    overview: Log a per-device message for workflow debugging.
    description: >
      Log a message to the run result for each device in the workflow context.
      The message can interpolate {path.to.value} placeholders — dot paths
      resolved per device, supporting device.* fields, attribute bags
      (nautobot.role.name, custom.field), capabilities, and status. A path
      that doesn't resolve renders as an empty string.
    artifact_type: control_flow
    palette_category: debug
    directory: log_message
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: message
          description: >
            Message logged for every device. Supports {path.to.value}
            placeholders resolved per device.
          data_type: string
          required: true
          example: "Device {device.name} processed from ISE"

  - id: log-attributes
    name: Log Attributes
    overview: Dump workflow context to STDOUT or a file.
    description: >
      Dump the full workflow context — every device field, attribute bag,
      parsed value, and metadata entry — to STDOUT or a file.
    artifact_type: control_flow
    palette_category: debug
    directory: log_attributes
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: output_destination
          description: Write the dump to STDOUT (worker logs) or to a file under DATA_DIRECTORY.
          data_type: string
          required: true
          default: stdout
          example: stdout
        - name: output_format
          description: Serialize the context as JSON or human-readable pretty text.
          data_type: string
          required: true
          default: json
          example: pretty_text
        - name: filename
          description: Relative filename when output_destination is file.
          data_type: string
          required: false
          default: attributes.txt
          example: workflow-attributes.json
        - name: append
          description: Append to an existing file instead of overwriting it.
          data_type: boolean
          required: false
          default: false
        - name: show_parsed_templates
          description: >
            Resolve and print the rendered output of any upstream "Render Jinja
            Template" step (device.parsed entries of kind "rendered_template")
            instead of just its artifact reference.
          data_type: boolean
          required: false
          default: false
        - name: show_device_configs
          description: >
            Resolve and print running and/or startup configuration text from any
            upstream "Get Device Configs" step (device.running_config_ref /
            device.startup_config_ref) instead of just the artifact references.
          data_type: boolean
          required: false
          default: false

  - id: show-summary
    name: Show Summary
    overview: Show a device x step status summary table for this workflow run.
    description: >
      Displays a table of every device against every step that ran in this
      workflow, with a success or failure indicator per cell. Click a
      failure to see the detailed error for that device and step.
    artifact_type: control_flow
    palette_category: debug
    directory: show_summary
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success

  - id: notify
    name: Notify Local
    overview: Write a notification for every device in the workflow context.
    description: >
      Records one notification per device in the workflow context (workflow
      name, owner, timestamp, severity, rendered message). Supports
      {path.to.value} placeholders resolved per device, same mechanism as Log
      Message. Notifications appear on the dashboard's Notifications card.
    artifact_type: control_flow
    palette_category: notify
    directory: notify
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: message
          description: >
            Message recorded for every device. Supports {path.to.value}
            placeholders resolved per device.
          data_type: string
          required: true
          example: "Could not get config from device {device.name}"
        - name: severity
          description: Notification severity — info, warning, or error.
          data_type: string
          required: true
          default: info
          example: warning

  - id: notify-mattermost
    name: Notify Mattermost
    overview: Post a message to a Mattermost channel.
    description: >
      Posts one message to a Mattermost channel via a configured Mattermost
      source, team, and channel. Supports {path.to.value} placeholders
      resolved against the first device in context (e.g. {device.name},
      {nautobot.location.name}), plus {devices} (comma-joined device names)
      and {device_count} for summarizing a multi-device run. Typically wired
      to an upstream step's success or failure outcome handle to report a
      workflow's outcome. Fan-out note: place after Fan In (or at the end of
      a non-fanned workflow) for one summary message per run; inside
      fan-out children it posts once per child branch.
    artifact_type: control_flow
    palette_category: notify
    directory: notify_mattermost
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: mattermost_source_id
          description: ID of a Mattermost source configured under Settings → Sources.
          data_type: string
          required: true
        - name: team_name
          description: Mattermost team name that owns the target channel.
          data_type: string
          required: true
        - name: channel_name
          description: Mattermost channel name to post the message to.
          data_type: string
          required: true
        - name: message
          description: >
            Message text. Supports {path.to.value} placeholders resolved
            against the first device in context, plus {devices} and
            {device_count} for multi-device summaries.
          data_type: string
          required: true
          example: "Workflow finished: {device_count} device(s) ({devices})"

  - id: notify-on-error
    name: Notify On Error
    overview: Write a notification for every accumulated error on every failed device.
    description: >
      Shared error sink for a workflow: wire many upstream steps' failure
      outcome handles to this one node instead of adding a notify node after
      every step. Writes one notification row per (device, error) pair —
      root-cause step id, node id, and message — from that device's
      accumulated error list, so a device that failed at more than one point
      before reaching this node still surfaces every failure, not just the
      latest. Devices with no accumulated errors (e.g. wired to a success
      handle by mistake) are skipped. Severity is always error. Place this
      node after the last step whose failures it should catch — branches
      converge into it before it runs once. Local notification and Mattermost
      posting (via a configured Mattermost source, team, and channel) are
      independently toggleable — either or both can be enabled. A Mattermost
      post failure is logged and does not fail the step or block local
      notifications.
    artifact_type: control_flow
    palette_category: notify
    directory: notify_on_error
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: message
          description: >
            Message template rendered once per accumulated error on each
            device, and reused verbatim as the Mattermost post text when that
            channel is enabled. Supports {path.to.value} placeholders
            resolved per device, plus {error.step_id}, {error.node_id},
            {error.code}, {error.message} for the specific error being
            reported.
          data_type: string
          required: true
          example: "Device {device.name} failed at {error.step_id}: {error.message}"
        - name: notify_local
          description: Write a local Notification row for each accumulated error.
          data_type: boolean
          required: false
          default: true
        - name: notify_mattermost
          description: Also post each accumulated error's rendered message to Mattermost.
          data_type: boolean
          required: false
          default: false
        - name: mattermost_source_id
          description: >
            ID of a Mattermost source configured under Settings → Sources.
            Required when notify_mattermost is true.
          data_type: string
          required: false
        - name: team_name
          description: >
            Mattermost team name that owns the target channel. Required when
            notify_mattermost is true.
          data_type: string
          required: false
        - name: channel_name
          description: >
            Mattermost channel name to post each message to. Required when
            notify_mattermost is true.
          data_type: string
          required: false

  - id: fan-in
    name: Fan In
    overview: Rejoin fan-out branches into one execution path.
    description: >
      Rejoin a fanned-out workflow into a single path. Per-device steps run in
      parallel child workflows up to this node; steps placed after it run once
      over all devices. Place git / store-artifact steps after Fan In for safe,
      single-commit exports.
    artifact_type: control_flow
    palette_category: routing
    directory: fan_in
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
    metadata:
      configuration_input: []

  - id: merge-content
    name: Merge Content
    overview: Merge upstream command output per device.
    description: >
      Combines the command output from one or more upstream run-command steps
      into a single merged artifact per device.
    artifact_type: control_flow
    palette_category: content_tools
    directory: merge_content
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: merged_content
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: source_step_node_ids
          description: Canvas node IDs of upstream run-command steps to include (empty = all).
          data_type: string_list
          required: false
        - name: merge_mode
          description: "text_sectioned | text_plain | json_merged"
          data_type: string
          required: true
        - name: section_separator
          description: String placed between command output blocks (text modes).
          data_type: string
          required: false
        - name: include_command_header
          description: Prepend === {command} === before each block in text_sectioned mode.
          data_type: boolean
          required: false

  - id: compare-data
    name: Compare Data
    overview: Compare device output to a reference file.
    description: >
      Compare device configuration or command output against a reference file on the
      local filesystem or in a git repository.
    artifact_type: control_flow
    palette_category: routing
    directory: compare_data
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: comparison_diff
    outcomes:
      - name: match
      - name: mismatch
      - name: failure
    metadata:
      configuration_input:
        - name: content_source
          description: >
            Which device content to compare (running_config, startup_config,
            command_output, latest_command_output, rendered_template, merged_content).
          data_type: string
          required: true
          example: merged_content
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream step when comparing command output,
            rendered templates, or merged content.
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from render-jinja-template when content_source is
            rendered_template.
          data_type: string
          required: false
        - name: reference_location
          description: Where the reference file is stored (filesystem or git).
          data_type: string
          required: false
          default: filesystem
          example: git
        - name: reference_subdirectory
          description: >
            Subdirectory under DATA_DIRECTORY for filesystem references
            (not scoped by workflow/run id).
          data_type: string
          required: false
          default: references
        - name: git_repository_id
          description: Git repository id from Settings → Git Repositories when reference_location is git.
          data_type: integer
          required: false
        - name: repository_subdirectory
          description: Optional path prefix inside the git repository before filename_template.
          data_type: string
          required: false
          example: network/backups
        - name: pull_before_read
          description: Pull latest changes once before reading a git reference file.
          data_type: boolean
          required: false
          default: false
        - name: filename_template
          description: >
            Per-device path to the reference file. Supports device, nautobot, git,
            command, and run placeholders.
          data_type: string
          required: true
          example: "{device.name}.cfg"
        - name: strict_templates
          description: Fail when nautobot.* or command.* placeholders resolve empty.
          data_type: boolean
          required: false
          default: true
        - name: normalize_line_endings
          description: Normalize CRLF/CR to LF before comparing.
          data_type: boolean
          required: false
          default: true
        - name: ignore_trailing_whitespace
          description: Strip trailing whitespace on each line before comparing.
          data_type: boolean
          required: false
          default: false
        - name: comparison_diff_key
          description: >
            Parsed key written per device on mismatch ({node_id}.comparison_diff).
            Contains the unified diff artifact for downstream steps and run inspection.
          data_type: string
          required: false
          example: compare-data-3.comparison_diff

  - id: filter-output
    name: Filter Output
    overview: Strip volatile keys or lines from command output.
    description: >
      Remove volatile keys (JSON) or lines (plain text) from command output
      using regex patterns or dot-path selectors. Use before compare-data or
      store-artifact when output contains timestamps, uptime, or other
      non-deterministic fields.
    artifact_type: control_flow
    palette_category: content_tools
    directory: filter_output
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: filtered_output
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: content_source
          description: Which upstream output to filter (command_output or merged_content).
          data_type: string
          required: true
          example: command_output
        - name: source_step_node_id
          description: Canvas node ID of the upstream step to read from.
          data_type: string
          required: true
        - name: filter_rules
          description: >
            Rules applied to the content. Each rule has either pattern (regex matched
            against JSON key names recursively, or against each text line) or path
            (dot-notation like route.ospf to remove a specific nested JSON key).
            For JSON arrays (textfsm output) rules apply to every element in the array.
          data_type: object_list
          required: true
          example:
            - pattern: "^uptime"
            - path: "route.ospf"

  - id: update-content
    name: Update Content
    overview: Search and replace text in a device's configuration.
    description: >
      Apply one or more ordered regex search/replace rules to a device's running or
      startup config and store the result for downstream steps.
    artifact_type: control_flow
    palette_category: content_tools
    directory: update_content
    enabled: true
    requires: [identity]
    produces: [parsed]
    consumes: []
    primary_output: updated_content
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: content_source
          description: Which device config to search/replace (running_config or startup_config).
          data_type: string
          required: true
          default: running_config
          example: running_config
        - name: replace_rules
          description: >
            Ordered list of search/replace rules applied in sequence to the config text.
            Each rule has a pattern (regex), a replacement (fixed text, or a template using
            Python backreferences like \1 or \g<name> to reuse captured groups),
            regex_flags, and replace_all (false = only the first match). A rule with no
            match leaves the text unchanged and is not an error.
          data_type: object_list
          required: true
          example:
            - pattern: "ntp server 192\\.168\\.1\\.10"
              replacement: "ntp server 192.168.178.10"
              regex_flags:
                case_insensitive: false
                multiline: false
                dotall: false
              replace_all: true

  - id: upload-config
    name: Upload Config
    overview: Upload a configuration file to a device via SCP.
    description: >
      Upload content produced by an earlier step (e.g. Update Content) to a device's
      filesystem using Netmiko's secure-copy or inline file transfer.
    artifact_type: command_execution
    palette_category: configuration_management
    directory: upload_config
    enabled: true
    requires: [identity]
    produces: []
    consumes: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: credential_reference
          description: >
            Credential vault name to use when credential_source is "fixed" (the default).
          data_type: credential_ref
          required: false
        - name: credential_source
          description: >
            "fixed" (default) uses credential_reference. "run_param" uses the credential
            vault name held in the run parameter named by credential_param — a workflow
            static_attribute of type "reference", ref_kind "credential" — resolved per
            triggering user (their private credential wins over a global one of the same
            name). Lets one workflow run under a different team's credentials per schedule.
          data_type: string
          required: false
          default: fixed
          example: run_param
        - name: credential_param
          description: >
            Name of the run parameter (workflow static_attribute) carrying the credential
            vault name, used only when credential_source is "run_param".
          data_type: string
          required: false
          example: ssh_credential
        - name: content_source
          description: Which upstream content to upload.
          data_type: string
          required: true
          default: updated_content
          example: updated_content
        - name: source_step_node_id
          description: >
            Canvas node id of the step that produced the content (not needed for
            running_config/startup_config).
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from the source step. Leave empty to use the
            content produced by the selected step.
          data_type: string
          required: false
        - name: destination_filename
          description: Target filename on the device filesystem.
          data_type: string
          required: true
          example: startup-config-new.cfg
        - name: file_system
          description: "Destination filesystem on the device, e.g. bootflash: or nvram:."
          data_type: string
          required: true
          example: "bootflash:"
        - name: overwrite
          description: Overwrite the destination file if it already exists.
          data_type: boolean
          required: false
          default: false
        - name: inline_transfer
          description: Use Netmiko's inline (non-SCP) transfer — text files only.
          data_type: boolean
          required: false
          default: false
        - name: network_driver_override
          description: Override the Netmiko device type for all devices in this step.
          data_type: string
          required: false
        - name: socket_timeout
          description: SCP/SFTP socket timeout in seconds.
          data_type: integer
          required: false
          default: 10
        - name: verify_content
          description: >
            Verify the uploaded content by comparing a locally computed checksum
            against the device's own `verify` command output.
          data_type: boolean
          required: false
          default: false
        - name: verify_algorithm
          description: Checksum algorithm for verify_content ("md5" or "sha512").
          data_type: string
          required: false
          default: md5
          example: sha512

  - id: render-jinja-template
    name: Render Jinja Template
    overview: Render a Jinja2 template per device.
    description: Render a Jinja2 template per device and store the result for downstream steps.
    artifact_type: template_rendering
    directory: render_jinja_template
    enabled: true
    requires: [identity]
    produces: [parsed]
    primary_output: rendered_template
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: output_key
          description: >
            Unique key for this template output on each device (used by downstream
            steps and canvas parsed-key validation).
          data_type: string
          required: true
          example: device_config
        - name: template_id
          description: >
            ID of a stored Jinja2 template from the template library, rendered
            once per device at workflow runtime.
          data_type: integer
          required: true

  - id: store-artifact
    name: Store Artifact
    overview: Persist backups, reports, or logs.
    description: >
      Persist generated content such as backups, reports, or logs.
      Fan-out note: filesystem and git sinks write shared destinations; concurrent
      child workflows can race on the same path or git working tree. Prefer
      per-device path templates or disable fan-out when using a shared sink.
    artifact_type: persistent_artifact
    directory: store_artifact
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: destination
          description: Where to persist exported artifacts (filesystem or git).
          data_type: string
          required: false
          default: filesystem
          example: git
        - name: git_repository_id
          description: >
            Git repository id from Settings → Git Repositories when destination is
            git (same repository as get-git-devices).
          data_type: integer
          required: false
          example: 3
        - name: repository_subdirectory
          description: Optional path prefix inside the git repository before filename_template.
          data_type: string
          required: false
          example: network/backups
        - name: pull_before_write
          description: Pull latest changes once before writing (fails step on pull error).
          data_type: boolean
          required: false
          default: false
        - name: commit_after_write
          description: Create one commit for all files written in this step.
          data_type: boolean
          required: false
          default: false
        - name: push_after_write
          description: Push after commit. Disable when a separate push step handles sync.
          data_type: boolean
          required: false
          default: false
        - name: commit_message_template
          description: Commit message template when commit_after_write is enabled.
          data_type: string
          required: false
          default: "commit {timestamp}"
          example: "Backup run {run.id}"
        - name: output_subdirectory
          description: Subdirectory under the data directory for filesystem exports.
          data_type: string
          required: false
          default: exports
        - name: content_source
          description: >
            Which device content to export from the workflow context
            (running_config, startup_config, command_output, latest_command_output,
            rendered_template, merged_content, or comparison_diff).
          data_type: string
          required: true
          example: running_config
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream step when exporting command output
            (run-command) or rendered templates (render-jinja-template).
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from render-jinja-template when content_source is
            rendered_template. When omitted, all rendered templates from the
            selected step are exported.
          data_type: string
          required: false
          example: device_config
        - name: filename_template
          description: >
            Output path template (filename or relative path with subdirectories).
            Use device.* for identity, nautobot.* for Nautobot attributes
            (requires get-nautobot-attributes), git.* for git source metadata
            (requires get-git-devices), run.* for run metadata, command.* for
            command exports, parsed.* for rendered template exports. A leading ./
            is optional.
          data_type: string
          required: true
          example: "./{nautobot.location.name}/{device.name}.cfg"
        - name: strict_templates
          description: Fail export when a namespaced placeholder resolves empty.
          data_type: boolean
          required: false
          default: true
        - name: retention_policy
          description: Retention policy that controls artifact lifecycle (reserved for future use).
          data_type: string
          required: false
          default: standard-90-days
          example: standard-90-days

  - id: git-clone
    name: Git Clone
    overview: Clone a git source to the local working tree.
    description: >
      Clone or re-clone a configured git source into the local working tree.
      Fan-out note: mutates a shared local working tree for the git source; not
      safe to run concurrently across fan-out children for the same source.
    artifact_type: persistent_artifact
    directory: git_clone
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: ID of a Git repository configured under Settings → Git Repositories.
          data_type: integer
          required: true
          example: 3
        - name: use_change_request_branch
          description: >
            When this run deploys an approved change request, clone the change
            request's per-change branch (manus/cr-{id}) instead of the default
            branch. No effect on ordinary runs.
          data_type: boolean
          required: false
          default: false

  - id: git-pull
    name: Git Pull
    overview: Pull latest changes for a git source.
    description: >
      Pull the latest changes for a configured git source.
      Fan-out note: mutates a shared local working tree for the git source; not
      safe to run concurrently across fan-out children for the same source.
    artifact_type: persistent_artifact
    directory: git_pull
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: ID of a Git repository configured under Settings → Git Repositories.
          data_type: integer
          required: true
          example: 3
        - name: use_change_request_branch
          description: >
            When this run deploys an approved change request, pull the change
            request's per-change branch (manus/cr-{id}) instead of the default
            branch. No effect on ordinary runs.
          data_type: boolean
          required: false
          default: false

  - id: git-push
    name: Git Push
    overview: Commit and push changes to git remote.
    description: >
      Commit exported changes and push them to the configured git source remote.
      Fan-out note: commits/pushes against a shared remote working tree; concurrent
      fan-out children for the same source can conflict. Prefer a single push after
      fan-in, or unique branches/paths per child.
    artifact_type: persistent_artifact
    directory: git_push
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: ID of a Git repository configured under Settings → Git Repositories.
          data_type: integer
          required: true
          example: 3
        - name: commit_before_push
          description: Stage and commit workflow exports before pushing to the remote.
          data_type: boolean
          required: false
          default: true
        - name: commit_message_template
          description: Commit message template when commit_before_push is enabled.
          data_type: string
          required: false
          default: "commit {timestamp}"
          example: "Backup run {run.id}"

  - id: open-change-request
    name: Open Change Request
    overview: Stage rendered configs on a branch for review before deploy.
    description: >
      End a stage run: commit the rendered configs from an upstream
      render-jinja-template step to a per-change git branch (manus/cr-{run.id}),
      push it, store a unified diff, and record a Change Request awaiting review.
      Approving the change request (UI or a signed git webhook) dispatches a
      separate deploy run. See doc/CICD_PIPELINE.md.
      Not fan-out-safe: it creates a branch and commits against a shared working
      tree. Place it after any Fan In node; never inside a fan-out branch.
    artifact_type: persistent_artifact
    directory: open_change_request
    enabled: true
    requires: [identity]
    produces: []
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: git_repository_id
          description: Git repository the per-change branch is pushed to.
          data_type: integer
          required: true
          example: 3
        - name: content_source
          description: >
            Which upstream device content to commit. Defaults to rendered_template
            (render-jinja-template output).
          data_type: string
          required: false
          default: rendered_template
          example: rendered_template
        - name: source_step_node_id
          description: >
            Canvas node id of the upstream render-jinja-template step to commit.
            Optional — when unset, every rendered template on the devices is
            committed. The UI auto-fills this when the workflow has exactly one
            render step.
          data_type: string
          required: false
        - name: parsed_output_key
          description: >
            Optional output_key from render-jinja-template; when omitted all
            rendered templates from the selected step are committed.
          data_type: string
          required: false
          example: device_config
        - name: repository_subdirectory
          description: Optional path prefix inside the repository before filename_template.
          data_type: string
          required: false
          example: network/candidates
        - name: filename_template
          description: >
            Per-device file path template. Use device.* for identity, nautobot.*
            for Nautobot attributes, run.* for run metadata.
          data_type: string
          required: false
          default: "{device.name}.cfg"
          example: "{nautobot.location.name}/{device.name}.cfg"
        - name: branch_template
          description: "Per-change branch name. Placeholders: {run.id}, {workflow.id}."
          data_type: string
          required: false
          default: "manus/cr-{run.id}"
        - name: commit_message_template
          description: Commit message for the staged change.
          data_type: string
          required: false
          default: "Change request: run {run.id}"
        - name: title_template
          description: Operator-facing title for the change request.
          data_type: string
          required: false
          default: "Change request for run {run.id}"
        - name: deploy_workflow_id
          description: >
            Workflow that deploys an approved change request. Optional — a
            reviewer may also choose one at approval time.
          data_type: integer
          required: false
          example: 7
        - name: expires_after_hours
          description: TTL for an un-actioned change request; 0 disables expiry.
          data_type: integer
          required: false
          default: 168
        - name: strict_templates
          description: Fail when a namespaced placeholder resolves empty.
          data_type: boolean
          required: false
          default: true

  - id: from-change-request
    name: From Change Request
    overview: Start a deploy workflow from an approved change request.
    description: >
      Inventory step for a deploy workflow. When the run was dispatched by a
      change-request approval it rebuilds the device list from the snapshot the
      Open Change Request step captured, checks out the manus/cr-{id} branch, and
      loads each device's reviewed config as running_config — so a deploy
      workflow can be just: From Change Request → Upload Config → Configure
      Replace Config. Fails if the run was not started by a change request. See
      doc/CICD_PIPELINE.md.
    artifact_type: inventory_selector
    directory: from_change_request
    enabled: true
    requires: []
    produces: [identity, running_config]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: checkout_branch
          description: >
            Also check out the change request's manus/cr-{id} branch into the
            repository working tree so later git-reading steps see it.
          data_type: boolean
          required: false
          default: true
        - name: load_configs
          description: >
            Load each device's committed config file (from the change request's
            device snapshot) as running_config.
          data_type: boolean
          required: false
          default: true

  - id: secret-get
    name: Secret Get
    overview: Read a secret from a configured Secret Manager connection.
    description: >
      Read one field from an external Secret Manager connection (OpenBao or
      Infisical) per device and seal it into the device's attribute bag — the
      TACACS+/SNMP "retrieve the current or a previous value" primitive. A
      device with no value at the configured path/field is routed to the
      failure outcome; the step itself still succeeds (proceed with
      survivors). See doc/SECRET_MANAGER_INTEGRATION.md.
    artifact_type: configuration_management
    palette_category: secrets
    directory: secret_get
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: connection_id
          description: Secret Manager connection (Settings → Secret Manager).
          data_type: integer
          required: true
          example: 1
        - name: path_template
          description: >
            Device-templated path, e.g. network/{device.name}/tacacs. Supports
            the same {device.*} / {nautobot.*} / {git.*} placeholders as
            store-artifact's filename_template.
          data_type: string
          required: true
          default: network/{device.name}/tacacs
        - name: field
          description: Field name within the secret at path_template.
          data_type: string
          required: true
          default: key
        - name: destination_path
          description: Attribute bag path the sealed value is written to.
          data_type: string
          required: true
          default: tacacs.shared_secret
        - name: version
          description: Optional specific version to read; blank reads the latest.
          data_type: integer
          required: false
        - name: strict_templates
          description: Fail when a namespaced placeholder in path_template resolves empty.
          data_type: boolean
          required: false
          default: true

  - id: secret-set
    name: Secret Set
    overview: Write a value from an attribute path to a Secret Manager connection.
    description: >
      Write a value read from another attribute path — a run input the
      operator supplied at trigger time (run_input.<name>), or a sealed value
      from an upstream secret-get / generate-password / secret-generate step —
      to one field of an external Secret Manager connection per device. Also
      seals the written value into the device's attribute bag so a later step
      in the same run can use it. There is no literal-value mode: step config
      is stored in plaintext in the workflow definition. See
      doc/SECRET_MANAGER_INTEGRATION.md.
    artifact_type: configuration_management
    palette_category: secrets
    directory: secret_set
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: connection_id
          description: Secret Manager connection (Settings → Secret Manager).
          data_type: integer
          required: true
          example: 1
        - name: path_template
          description: Device-templated path, e.g. network/{device.name}/tacacs.
          data_type: string
          required: true
          default: network/{device.name}/tacacs
        - name: field
          description: Field name within the secret at path_template.
          data_type: string
          required: true
          default: key
        - name: source_path
          description: >
            Attribute path to read the value from (e.g.
            run_input.new_tacacs_key, or the destination_path of an upstream
            generate-password step). A sealed value is read as cleartext for
            this write only.
          data_type: string
          required: true
          default: run_input.new_tacacs_key
        - name: destination_path
          description: Attribute bag path the sealed value is also written to.
          data_type: string
          required: true
          default: tacacs.shared_secret
        - name: strict_templates
          description: Fail when a namespaced placeholder in path_template resolves empty.
          data_type: boolean
          required: false
          default: true

  - id: generate-password
    name: Generate Password
    overview: Generate a strong random password per device.
    description: >
      Generate a cryptographically random password per device — no external
      Secret Manager connection required — and seal it into the device's
      attribute bag for a later step in the same run (e.g. a push-config
      step). The password composition (digit/uppercase/lowercase/special
      minimums) is fully configurable. The generated value is never shown in
      the run UI, never logged, and never persisted in plaintext.
    artifact_type: configuration_management
    palette_category: secrets
    directory: generate_password
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
    metadata:
      configuration_input:
        - name: length
          description: Total password length.
          data_type: integer
          required: false
          default: 16
        - name: min_digits
          description: Minimum count of digits (0-9). 0 excludes digits entirely.
          data_type: integer
          required: false
          default: 2
        - name: min_uppercase
          description: Minimum count of uppercase letters. 0 excludes uppercase entirely.
          data_type: integer
          required: false
          default: 2
        - name: min_lowercase
          description: Minimum count of lowercase letters. 0 excludes lowercase entirely.
          data_type: integer
          required: false
          default: 2
        - name: min_special
          description: Minimum count of special characters. 0 excludes special characters entirely.
          data_type: integer
          required: false
          default: 2
        - name: destination_path
          description: Attribute bag path the sealed password is written to.
          data_type: string
          required: true
          default: generated_password.value

  - id: secret-generate
    name: Secret Generate
    overview: Generate and store a random secret per device.
    description: >
      Generate a cryptographically random value per device, store it at one
      field of an external Secret Manager connection, and seal it into the
      device's attribute bag for a later step in the same run (e.g. a
      push-config step) — the TACACS+/SNMP rotation primitive. The generated
      value is never shown in the run UI, never logged, and never persisted
      in plaintext. See doc/SECRET_MANAGER_INTEGRATION.md.
    artifact_type: configuration_management
    palette_category: secrets
    directory: secret_generate
    enabled: true
    requires: [identity]
    produces: [attributes]
    outcomes:
      - name: success
      - name: failure
    metadata:
      configuration_input:
        - name: connection_id
          description: Secret Manager connection (Settings → Secret Manager).
          data_type: integer
          required: true
          example: 1
        - name: path_template
          description: Device-templated path, e.g. network/{device.name}/tacacs.
          data_type: string
          required: true
          default: network/{device.name}/tacacs
        - name: field
          description: Field name within the secret at path_template.
          data_type: string
          required: true
          default: key
        - name: destination_path
          description: Attribute bag path the sealed value is written to.
          data_type: string
          required: true
          default: tacacs.shared_secret
        - name: charset
          description: hex (TACACS+/tokens), alnum (SNMP community strings), or alnum_symbols (SNMPv3 passphrases).
          data_type: string
          required: false
          default: hex
        - name: length
          description: Generated value length (4-256 characters).
          data_type: integer
          required: false
          default: 32
        - name: strict_templates
          description: Fail when a namespaced placeholder in path_template resolves empty.
          data_type: boolean
          required: false
          default: true
