            (default), "devices" carries every node with a matching
            interface regardless of value. Requires "properties" to be set
            explicitly.
          data_type: boolean
          required: false
          default: false
        - name: empty_match_mode
          description: >
            Only load-bearing with more than one "properties" entry: "any"
            (default) flags an interface if at least one requested property
            is empty; "all" flags it only if every requested property is
            empty.
          data_type: string
          required: false
          default: any
        - name: output_key
          description: Metadata key this step's result is stored under ({node_id}.<output_key>).
          data_type: string
          required: false
          default: batfish_interface_properties
        - name: batfish_source_id
          description: >
            Configured Batfish source to query directly, bypassing this
            run's metadata. Leave blank to use the snapshot recorded by an
            upstream Init Batfish Snapshot step (default). Must be set
            together with "network".
          data_type: string
          required: false
        - name: network
          description: >
            Batfish network to query directly when batfish_source_id is also
            set. Bypasses this run's metadata.
          data_type: string
          required: false
        - name: snapshot
          description: >
            Snapshot name to query within "network". Leave blank to use the
