name: pyats-shim-ci

on:
  push:
    branches: [main]
    paths:
      - "pyats-shim/**"
      - ".github/workflows/pyats-shim-ci.yml"
  pull_request:
    paths:
      - "pyats-shim/**"
      - ".github/workflows/pyats-shim-ci.yml"

defaults:
  run:
    working-directory: pyats-shim

concurrency:
  group: pyats-shim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # the version of pyats-shim/Dockerfile
      # The shim imports pyats/genie lazily (they exist only inside the container image), so the
      # tests run without the very large `pyats[full]`; the one module that needs pyats is skipped
      # by importorskip. Everything else comes from the two requirements files.
      - name: install dependencies (without pyats)
        run: |
          grep -hvE '^(#|-r|pyats|$)' requirements.txt requirements-dev.txt > "${RUNNER_TEMP}/shim-requirements.txt"
          cat "${RUNNER_TEMP}/shim-requirements.txt"
          pip install -r "${RUNNER_TEMP}/shim-requirements.txt"
      - name: pytest
        run: python -m pytest -q
